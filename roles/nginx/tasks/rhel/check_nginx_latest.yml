# Check if the latest software package of nginx is installed; the grep matches
# the nginx package exactly (name.arch), not packages merely containing "nginx"
- name: "{{ rule }} | Audit"
  shell:
    cmd: |
      audit="$(dnf -q check-update nginx 2>/dev/null)"
      echo "$audit" | grep -Eq '^nginx\.[a-z0-9_]+\s' && echo out_dated || echo latest
  changed_when: false
  register: nginx_latest_status
