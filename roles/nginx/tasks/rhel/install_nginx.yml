# Remove nginx installed from an untrusted repository
- name: "{{ rule }} | Remediation"
  yum:
    name: nginx
    state: absent
  when: uninstall_nginx | default(false)

# Configure the official nginx.org stable repository
- name: "{{ rule }} | Remediation"
  copy:
    dest: /etc/yum.repos.d/nginx.repo
    content: |
      [nginx-stable]
      name=nginx stable repo
      baseurl=https://nginx.org/packages/centos/$releasever/$basearch/
      gpgcheck=1
      enabled=1
      gpgkey=https://nginx.org/keys/nginx_signing.key
      module_hotfixes=true
    owner: root
    group: root
    mode: "0644"

# Install nginx from the trusted repository
- name: "{{ rule }} | Remediation"
  yum:
    name: nginx
    update_cache: true
    state: latest

# Clear a stale PID file left by a configuration test before starting: it
# carries the label of the process that ran the test, which the nginx domain
# is denied, and a fresh one is created by the service itself
- name: "{{ rule }} | Remediation"
  shell:
    cmd: |
      pid_file_path="$(nginx -V 2>&1 | tr ' ' '\n' | grep -- '--pid-path=' | head -n 1 | cut -d= -f2)"
      pid_file_path="${pid_file_path:-/run/nginx.pid}"
      if [ -e "$pid_file_path" ] && [ ! -s "$pid_file_path" ]; then
          rm -f "$pid_file_path"
      fi
      true
  changed_when: false
  when: not container

# Enable and start the service, otherwise the package manager leaves it
# installed but inactive on platforms whose presets do not enable it, and the
# hardened configuration never takes effect
- name: "{{ rule }} | Remediation"
  systemd:
    name: nginx
    enabled: true
    state: started
    daemon_reload: true
  when: not container
