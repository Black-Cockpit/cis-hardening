# 1.2 Configure Software Updates
- name: 1.2 Configure Software Updates
  block:
  # 1.2.1 Ensure package manager repositories are properly configured
  #
  # Package repositories must be trustworthy, properly configured, and
  # maintained so the system receives timely security patches. The repository
  # serving nginx must point to a trusted domain: nginx.org or the OS vendor.
  - name: "1.2.1 Ensure package manager repositories are properly configured"
    block:
    # 1.2.1 Ensure package manager repositories are properly configured | Audit
    - include_tasks:
        file: "{{ target_platform }}/check_nginx_stable.yml"
      vars:
        rule: 1.2.1 Ensure package manager repositories are properly configured

    # Extract audit result
    - set_fact:
        nginx_stable_repo_check:
          id: nginx_repositories_properly_configured
          name: 1.2.1 Ensure package manager repositories are properly configured
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_stable_repo_status.stdout == 'trusted' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_stable_repo_check] }}"
      changed_when: false

    # 1.2.1 Ensure package manager repositories are properly configured | Remediation
    - include_tasks:
        file: "{{ target_platform }}/install_nginx.yml"
      vars:
        rule: "1.2.1 Ensure package manager repositories are properly configured"
        uninstall_nginx: true
      when: not audit_only and not nginx_stable_repo_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: "('web_server_level_1' in levels or 'web_server_level_2' in levels) or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels) or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)"



  # 1.2.2 Ensure the latest software package is installed
  #
  # As new security vulnerabilities are discovered, the corresponding fixes are
  # implemented by the nginx software package provider. Installing the latest
  # software version ensures these fixes are available on the system.
  - name: "1.2.2 Ensure the latest software package is installed"
    block:
    # 1.2.2 Ensure the latest software package is installed | Audit
    - include_tasks:
        file: "{{ target_platform }}/check_nginx_latest.yml"
      vars:
        rule: 1.2.2 Ensure the latest software package is installed

    # Extract audit result
    - set_fact:
        nginx_latest_check:
          id: nginx_latest_package_installed
          name: 1.2.2 Ensure the latest software package is installed
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_latest_status.stdout == 'latest' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_latest_check] }}"
      changed_when: false

    # 1.2.2 Ensure the latest software package is installed | Remediation
    - name: "1.2.2 Ensure the latest software package is installed | Remediation"
      yum:
        name: nginx
        state: latest
        update_cache: true
      when: not audit_only and not nginx_latest_check.remediation_status and target_platform == 'rhel'

    # 1.2.2 Ensure the latest software package is installed | Remediation
    - name: "1.2.2 Ensure the latest software package is installed | Remediation"
      apt:
        name: nginx
        state: latest
        only_upgrade: true
        update_cache: true
      when: not audit_only and not nginx_latest_check.remediation_status and target_platform == 'debian'
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: "('web_server_level_1' in levels or 'web_server_level_2' in levels) or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels) or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)"
