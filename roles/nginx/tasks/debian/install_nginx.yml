# Remove nginx installed from an untrusted repository
- name: "{{ rule }} | Remediation"
  apt:
    name: nginx
    state: absent
    purge: true
    force: true
  when: uninstall_nginx | default(false)

# Install the nginx.org package signing key
- name: "{{ rule }} | Remediation"
  get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: /usr/share/keyrings/nginx_signing.key
    owner: root
    group: root
    mode: "0644"

# Configure the official nginx.org stable repository
- name: "{{ rule }} | Remediation"
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nginx_signing.key] http://nginx.org/packages/{{ 'ubuntu' if ansible_distribution == 'Ubuntu' else 'debian' }} {{ ansible_distribution_release }} nginx"
    filename: nginx
    update_cache: yes
    state: present
    mode: "0644"

# Install nginx from the trusted repository
- name: "{{ rule }} | Remediation"
  apt:
    name: nginx
    state: latest
