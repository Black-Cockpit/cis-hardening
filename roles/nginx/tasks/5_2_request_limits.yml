# 5.2 Request Limits
- name: 5.2 Request Limits
  block:
  # 5.2.1 Ensure timeout values for reading the client header and body are set correctly
  #
  # The client_header_timeout directive sets the maximum time the server will
  # wait for a client to send the request header. The client_body_timeout
  # directive sets the maximum time allowed between sequential read operations
  # when receiving the request body. Explicitly low values protect against
  # slow clients holding connections open indefinitely.
  - name: "5.2.1 Ensure timeout values for reading the client header and body are set correctly"
    block:
    # 5.2.1 Ensure timeout values for reading the client header and body are set correctly | Audit
    - name: "5.2.1 Ensure timeout values for reading the client header and body are set correctly | Audit"
      shell:
        cmd: |
          value=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*client_body_timeout[[:space:]]' | head -n 1 | awk '{print $2}' | sed -e 's/[^0-9]//g')
          if [ -n "$value" ] && [ "$value" -ge 1 ] && [ "$value" -le {{ client_body_timeout | default(cis_defaults.client_body_timeout) }} ]; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_client_body_timeout_status

    # 5.2.1 Ensure timeout values for reading the client header and body are set correctly | Audit
    - name: "5.2.1 Ensure timeout values for reading the client header and body are set correctly | Audit"
      shell:
        cmd: |
          value=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*client_header_timeout[[:space:]]' | head -n 1 | awk '{print $2}' | sed -e 's/[^0-9]//g')
          if [ -n "$value" ] && [ "$value" -ge 1 ] && [ "$value" -le {{ client_header_timeout | default(cis_defaults.client_header_timeout) }} ]; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_client_header_timeout_status

    # Extract audit result
    - set_fact:
        nginx_timeout_check:
          id: nginx_client_header_body_timeouts_configured
          name: 5.2.1 Ensure timeout values for reading the client header and body are set correctly
          scored: true
          automated: false
          remediation_status: "{{ true if (nginx_client_body_timeout_status.stdout == 'configured' and nginx_client_header_timeout_status.stdout == 'configured') else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_timeout_check] }}"
      changed_when: false

    # 5.2.1 Ensure timeout values for reading the client header and body are set correctly | Remediation
    - name: "5.2.1 Ensure timeout values for reading the client header and body are set correctly | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '[#]{0,}[\s]{0,}(client_header_timeout|client_body_timeout).+[;]'
        state: absent
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_timeout_check.remediation_status

    # 5.2.1 Ensure timeout values for reading the client header and body are set correctly | Remediation
    - name: "5.2.1 Ensure timeout values for reading the client header and body are set correctly | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: 'client_header_timeout {{ client_header_timeout | default(cis_defaults.client_header_timeout) }};'
        line: "\tclient_header_timeout {{ client_header_timeout | default(cis_defaults.client_header_timeout) }};"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_timeout_check.remediation_status

    # 5.2.1 Ensure timeout values for reading the client header and body are set correctly | Remediation
    - name: "5.2.1 Ensure timeout values for reading the client header and body are set correctly | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: 'client_body_timeout {{ client_body_timeout | default(cis_defaults.client_body_timeout) }};'
        line: "\tclient_body_timeout {{ client_body_timeout | default(cis_defaults.client_body_timeout) }};"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_timeout_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 5.2.2 Ensure the maximum request body size is set correctly
  #
  # The client_max_body_size directive defines the maximum permissible size
  # for a client request body, as indicated by the Content-Length header.
  # Requests exceeding this size are rejected with a 413 Request Entity Too
  # Large error before being processed further or passed to a backend.
  - name: "5.2.2 Ensure the maximum request body size is set correctly"
    block:
    # 5.2.2 Ensure the maximum request body size is set correctly | Audit
    - name: "5.2.2 Ensure the maximum request body size is set correctly | Audit"
      shell:
        cmd: |
          if nginx -T 2>/dev/null | grep -qE '^[[:space:]]*client_max_body_size[[:space:]]+[^;]+;'; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_client_max_body_size_status

    # Extract audit result
    - set_fact:
        nginx_client_max_body_size_check:
          id: nginx_max_request_body_size_configured
          name: 5.2.2 Ensure the maximum request body size is set correctly
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_client_max_body_size_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_client_max_body_size_check] }}"
      changed_when: false

    # 5.2.2 Ensure the maximum request body size is set correctly | Remediation
    - name: "5.2.2 Ensure the maximum request body size is set correctly | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '[#]{0,}[\s]{0,}(client_max_body_size).+[;]'
        state: absent
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_client_max_body_size_check.remediation_status

    # 5.2.2 Ensure the maximum request body size is set correctly | Remediation
    - name: "5.2.2 Ensure the maximum request body size is set correctly | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: 'client_max_body_size {{ client_max_body_size | default(cis_defaults.client_max_body_size) }};'
        line: "\tclient_max_body_size {{ client_max_body_size | default(cis_defaults.client_max_body_size) }};"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_client_max_body_size_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 5.2.3 Ensure the maximum buffer size for URIs is defined
  #
  # The large_client_header_buffers directive allocates the maximum number and
  # size of buffers for reading the entire client request header. The compiled
  # default of 4 8k is considered compliant and secure for general use; an
  # explicit restrictive value (e.g. 2 1k) is a deviation from the default and
  # a potential availability risk unless documented, intentional, and
  # necessary for the specific application.
  - name: "5.2.3 Ensure the maximum buffer size for URIs is defined"
    block:
    # 5.2.3 Ensure the maximum buffer size for URIs is defined | Audit
    - name: "5.2.3 Ensure the maximum buffer size for URIs is defined | Audit"
      shell:
        cmd: |
          directive=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*large_client_header_buffers[[:space:]]' | head -n 1)
          if [ -z "$directive" ]; then
              echo 'compliant'
          elif echo "$directive" | grep -qE 'large_client_header_buffers[[:space:]]+4[[:space:]]+8k[[:space:]]*;'; then
              echo 'compliant'
          else
              echo 'deviation'
          fi
      changed_when: false
      register: nginx_large_client_header_buffers_status

    # Extract audit result
    - set_fact:
        nginx_large_client_header_buffers_check:
          id: nginx_uri_buffer_size_not_overridden
          name: 5.2.3 Ensure the maximum buffer size for URIs is defined
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_large_client_header_buffers_status.stdout == 'compliant' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_large_client_header_buffers_check] }}"
      changed_when: false

    # 5.2.3 Ensure the maximum buffer size for URIs is defined | Remediation
    # Removing the explicit directive restores the compiled-in default of 4 8k.
    - name: "5.2.3 Ensure the maximum buffer size for URIs is defined | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '[#]{0,}[\s]{0,}(large_client_header_buffers).+[;]'
        state: absent
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_large_client_header_buffers_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 5.2.4 Ensure the number of connections per IP address is limited
  #
  # The ngx_http_limit_conn_module limits the number of simultaneous
  # connections from a single client IP address: limit_conn_zone creates a
  # shared memory zone keyed by client address in the http block, and
  # limit_conn enforces a specific connection limit in a server or location
  # block. Clients exceeding the limit receive a 503 error.
  - name: "5.2.4 Ensure the number of connections per IP address is limited"
    block:
    # 5.2.4 Ensure the number of connections per IP address is limited | Audit
    - name: "5.2.4 Ensure the number of connections per IP address is limited | Audit"
      shell:
        cmd: |
          limits=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*(limit_conn_zone|limit_conn)[[:space:]]')
          if echo "$limits" | grep -q 'limit_conn_zone' && echo "$limits" | grep -qE 'limit_conn[[:space:]]'; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_limit_conn_status

    # Extract audit result
    - set_fact:
        nginx_ip_connection_limit_check:
          id: nginx_connections_per_ip_limited
          name: 5.2.4 Ensure the number of connections per IP address is limited
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_limit_conn_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_ip_connection_limit_check] }}"
      changed_when: false

    # 5.2.4 Ensure the number of connections per IP address is limited | Remediation
    - name: "5.2.4 Ensure the number of connections per IP address is limited | Remediation"
      debug:
        msg:
        - "Define a shared memory zone in the http block, e.g. 'limit_conn_zone $binary_remote_addr zone=per_ip:10m;' ($binary_remote_addr is more memory-efficient than $remote_addr; 1 MB stores roughly 16384 states)."
        - "Apply a carefully considered limit in the server or location context, e.g. 'limit_conn per_ip 20;' for a public site."
        - "Apply stricter limits to resource-intensive locations, e.g. 'location /downloads/ { limit_conn per_ip 5; }'."
        - "The configured limit must be justifiable for its context (public website vs a specific /login location)."
      when: not audit_only and not nginx_ip_connection_limit_check.remediation_status
    tags:
    - "web_server_level_2"
    - "load_balancer_level_2"
    - "reverse_proxy_level_2"
    when: "'web_server_level_2' in levels or 'load_balancer_level_2' in levels or 'reverse_proxy_level_2' in levels"



  # 5.2.5 Ensure rate limits by IP address are set
  #
  # The ngx_http_limit_req_module limits the rate of incoming requests from a
  # single client IP address using the leaky bucket algorithm: limit_req_zone
  # defines the zone and average rate in the http block, and limit_req
  # enforces the limit in a server or location block, defining how bursts of
  # traffic are handled.
  - name: "5.2.5 Ensure rate limits by IP address are set"
    block:
    # 5.2.5 Ensure rate limits by IP address are set | Audit
    - name: "5.2.5 Ensure rate limits by IP address are set | Audit"
      shell:
        cmd: |
          limits=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*(limit_req_zone|limit_req)[[:space:]]')
          if echo "$limits" | grep -q 'limit_req_zone' && echo "$limits" | grep -qE 'limit_req[[:space:]]'; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_limit_req_status

    # Extract audit result
    - set_fact:
        nginx_request_rate_limit_check:
          id: nginx_rate_limits_by_ip
          name: 5.2.5 Ensure rate limits by IP address are set
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_limit_req_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_request_rate_limit_check] }}"
      changed_when: false

    # 5.2.5 Ensure rate limits by IP address are set | Remediation
    - name: "5.2.5 Ensure rate limits by IP address are set | Remediation"
      debug:
        msg:
        - "Define a shared memory zone in the http block, e.g. 'limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;'."
        - "Apply the limit only to the specific location blocks that require protection, not globally, e.g. 'location /login { limit_req zone=login_limit burst=5 nodelay; }'."
        - "Tune rate and burst for the protected endpoint; 'nodelay' processes burst requests immediately and rejects only requests beyond the burst size, which is generally preferred for APIs and login pages."
      when: not audit_only and not nginx_request_rate_limit_check.remediation_status
    tags:
    - "web_server_level_2"
    - "load_balancer_level_2"
    - "reverse_proxy_level_2"
    when: "'web_server_level_2' in levels or 'load_balancer_level_2' in levels or 'reverse_proxy_level_2' in levels"
