# 5.3 Browser Security
- name: 5.3 Browser Security
  block:
  # 5.3.1 Ensure X-Content-Type-Options header is configured and enabled
  #
  # The X-Content-Type-Options header instructs the browser to strictly follow
  # the MIME types declared in the Content-Type headers and not to guess
  # ("sniff") the content type based on the file's actual content. The always
  # parameter keeps the header attached to error responses as well.
  - name: "5.3.1 Ensure X-Content-Type-Options header is configured and enabled"
    block:
    # 5.3.1 Ensure X-Content-Type-Options header is configured and enabled | Audit
    - name: "5.3.1 Ensure X-Content-Type-Options header is configured and enabled | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          header=$(nginx -T 2>/dev/null | grep -iE '^[[:space:]]*add_header[[:space:]]+X-Content-Type-Options[[:space:]]')
          if [ -n "$header" ] \
             && echo "$header" | grep -qi 'nosniff' \
             && echo "$header" | grep -qiE 'always[[:space:]]*;'; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_x_content_type_status

    # Extract audit result
    - set_fact:
        nginx_x_content_type_check:
          id: nginx_x_content_type_options_header
          name: 5.3.1 Ensure X-Content-Type-Options header is configured and enabled
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_x_content_type_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_x_content_type_check] }}"
      changed_when: false

    # 5.3.1 Ensure X-Content-Type-Options header is configured and enabled | Remediation
    - name: "5.3.1 Ensure X-Content-Type-Options header is configured and enabled | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '[#]{0,}[\s]{0,}add_header[\s]+X-Content-Type-Options[\s]+.+[;]'
        state: absent
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_x_content_type_check.remediation_status

    # 5.3.1 Ensure X-Content-Type-Options header is configured and enabled | Remediation
    - name: "5.3.1 Ensure X-Content-Type-Options header is configured and enabled | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: 'add_header[\s]+X-Content-Type-Options[\s]'
        line: "\tadd_header X-Content-Type-Options \"nosniff\" always;"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_x_content_type_check.remediation_status
    tags:
    - "web_server_level_1"
    when: "'web_server_level_1' in levels or 'web_server_level_2' in levels"



  # 5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly
  #
  # Content Security Policy declares the approved sources of content a browser
  # may load for a page, which mitigates cross-site scripting and data
  # injection. Its frame-ancestors directive carries the clickjacking
  # protection formerly provided by the X-Frame-Options header, and the always
  # parameter keeps the policy attached to error responses.
  - name: "5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly"
    block:
    # 5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly | Audit
    - name: "5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          header=$(nginx -T 2>/dev/null | grep -iE '^[[:space:]]*add_header[[:space:]]+Content-Security-Policy[[:space:]]')
          if [ -n "$header" ] \
             && echo "$header" | grep -qi 'default-src' \
             && echo "$header" | grep -qi 'frame-ancestors' \
             && echo "$header" | grep -qiE 'always[[:space:]]*;' \
             && ! echo "$header" | grep -qiE 'unsafe-inline|unsafe-eval'; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_content_security_policy_status

    # Extract audit result
    - set_fact:
        nginx_content_security_policy_check:
          id: nginx_content_security_policy_configured
          name: 5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_content_security_policy_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_content_security_policy_check] }}"
      changed_when: false

    # 5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly | Remediation
    - name: "5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '[#]{0,}[\s]{0,}add_header[\s]+Content-Security-Policy[\s]+.+[;]'
        state: absent
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_content_security_policy_check.remediation_status

    # 5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly | Remediation
    - name: "5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: 'add_header[\s]+Content-Security-Policy[\s]'
        line: "\tadd_header Content-Security-Policy \"{{ csp_policy | default(cis_defaults.csp_policy) }}\" always;"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_content_security_policy_check.remediation_status

    # 5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly | Remediation
    - name: "5.3.2 Ensure that Content Security Policy (CSP) is enabled and configured properly | Remediation"
      debug:
        msg:
        - "The baseline policy '{{ csp_policy | default(cis_defaults.csp_policy) }}' denies every source except the site's own origin and blocks framing by third parties."
        - "Tailor the policy to the application: widen individual directives only for the origins the application really loads, e.g. \"default-src 'self'; img-src 'self' https://cdn.example.com; frame-ancestors 'self' https://partner-site.com;\"."
        - "Keep unsafe-inline and unsafe-eval out of script-src; allowing them defeats most of the cross-site scripting protection."
        - "Use the Content-Security-Policy-Report-Only header while testing a new policy so violations are reported without breaking the site."
      when: not audit_only and not nginx_content_security_policy_check.remediation_status
    tags:
    - "web_server_level_2"
    when: "'web_server_level_2' in levels"



  # 5.3.3 Ensure the Referrer Policy is enabled and configured properly
  #
  # The Referrer-Policy header controls how much referrer information is sent
  # with outgoing requests, preventing sensitive URL parameters and internal
  # path structures from leaking to third parties. The always parameter keeps
  # the policy attached to error responses.
  - name: "5.3.3 Ensure the Referrer Policy is enabled and configured properly"
    block:
    # 5.3.3 Ensure the Referrer Policy is enabled and configured properly | Audit
    - name: "5.3.3 Ensure the Referrer Policy is enabled and configured properly | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          header=$(nginx -T 2>/dev/null | grep -iE '^[[:space:]]*add_header[[:space:]]+Referrer-Policy[[:space:]]')
          if [ -n "$header" ] \
             && echo "$header" | grep -qiE 'Referrer-Policy[[:space:]]+"?(no-referrer|strict-origin-when-cross-origin|strict-origin|same-origin)"?[[:space:]]+always[[:space:]]*;'; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_referrer_policy_status

    # Extract audit result
    - set_fact:
        nginx_referrer_policy_check:
          id: nginx_referrer_policy_configured
          name: 5.3.3 Ensure the Referrer Policy is enabled and configured properly
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_referrer_policy_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_referrer_policy_check] }}"
      changed_when: false

    # 5.3.3 Ensure the Referrer Policy is enabled and configured properly | Remediation
    - name: "5.3.3 Ensure the Referrer Policy is enabled and configured properly | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: '[#]{0,}[\s]{0,}add_header[\s]+Referrer-Policy[\s]+.+[;]'
        state: absent
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_referrer_policy_check.remediation_status

    # 5.3.3 Ensure the Referrer Policy is enabled and configured properly | Remediation
    - name: "5.3.3 Ensure the Referrer Policy is enabled and configured properly | Remediation"
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: 'add_header[\s]+Referrer-Policy[\s]'
        line: "\tadd_header Referrer-Policy \"{{ referrer_policy | default(cis_defaults.referrer_policy) }}\" always;"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_referrer_policy_check.remediation_status
    tags:
    - "web_server_level_2"
    when: "'web_server_level_2' in levels"
