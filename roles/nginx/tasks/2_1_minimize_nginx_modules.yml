# 2.1 Minimize NGINX Modules
- name: 2.1 Minimize NGINX Modules
  block:
  # 2.1.1 Ensure only required dynamic modules are loaded
  #
  # NGINX functionality is provided by modules that are either compiled statically
  # into the binary or loaded dynamically at runtime via the load_module directive.
  # Only strictly required dynamic modules should be loaded to reduce the attack
  # surface, and the static modules compiled into the binary should be reviewed so
  # that risky ones are not enabled in any server or location block.
  - name: "2.1.1 Ensure only required dynamic modules are loaded"
    block:
    # 2.1.1 Ensure only required dynamic modules are loaded | Audit
    - name: "2.1.1 Ensure only required dynamic modules are loaded | Audit"
      shell:
        cmd: |
          if ! command -v nginx &> /dev/null; then
              echo 'audit_error: nginx binary not found'
          elif ! nginx -T &> /dev/null; then
              echo 'audit_error: nginx -T could not load the configuration'
          else
              nginx -T 2>/dev/null | grep -E '^[[:space:]]*load_module' || true
          fi
      changed_when: false
      register: nginx_dynamic_modules_status

    # 2.1.1 Ensure only required dynamic modules are loaded | Audit
    - name: "2.1.1 Ensure only required dynamic modules are loaded | Audit"
      shell:
        cmd: nginx -V 2>&1 | grep -oEi '\-\-(with|without)-[^ ]*' || true
      changed_when: false
      register: nginx_static_modules_status

    # Extract audit result
    - set_fact:
        nginx_dynamic_modules_check:
          id: nginx_only_required_dynamic_modules_loaded
          name: 2.1.1 Ensure only required dynamic modules are loaded
          scored: true
          automated: false
          remediation_status: "{{ true if (nginx_dynamic_modules_status.stdout | trim | length) == 0 else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_dynamic_modules_check] }}"
      changed_when: false

    # 2.1.1 Ensure only required dynamic modules are loaded | Remediation
    - name: "2.1.1 Ensure only required dynamic modules are loaded | Remediation"
      debug:
        msg: |
          Review the dynamic modules loaded by the running configuration:

          {{ nginx_dynamic_modules_status.stdout }}

          Comment out or remove the load_module directive in /etc/nginx/nginx.conf,
          or in the relevant include file (e.g. under /etc/nginx/modules-enabled/),
          for every module that is not strictly required, then reload nginx.

          Static modules compiled into the binary cannot be removed from pre-built
          packages. Ensure their directives are not used in the configuration, or
          switch to a custom build or a different package flavor that excludes them:

          {{ nginx_static_modules_status.stdout }}
      when: not audit_only and not nginx_dynamic_modules_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)
