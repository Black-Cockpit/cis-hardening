# 4.1 TLS / SSL Configuration
- name: 4.1 TLS / SSL Configuration
  block:
  # 4.1.1 Ensure HTTP is redirected to HTTPS
  #
  # Browsers and clients establish encrypted connections with servers by leveraging
  # HTTPS. Requests leveraging HTTP are unencrypted. Unencrypted requests should be
  # redirected so they are encrypted. Any listening HTTP port on your web server should
  # redirect to a server profile that uses encryption. The default HTTP (unencrypted) port
  # is 80.
  - name: "4.1.1 Ensure HTTP is redirected to HTTPS"
    block:
    # 4.1.1 Ensure HTTP is redirected to HTTPS | Audit
    - name: "4.1.1 Ensure HTTP is redirected to HTTPS | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          configuration=$(nginx -T 2>/dev/null || true)
          if [ -z "$configuration" ]; then
              configuration=$(grep -rhs -e 'listen' -e 'return' /etc/nginx 2>/dev/null || true)
          fi
          if [ -z "$configuration" ]; then echo 'not_configured'; exit 0; fi
          plain_listeners=$(echo "$configuration" | grep -E '^[[:space:]]*listen[[:space:]]+(\[::\]:|[0-9.]+:)?80([[:space:]]|;)' || true)
          if [ -z "$plain_listeners" ]; then echo 'configured'; exit 0; fi
          if echo "$configuration" | grep -qE '^[[:space:]]*return[[:space:]]+30[0-9][[:space:]]+https://'; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_https_redirection_status

    # Extract audit result
    - set_fact:
        nginx_https_redirection_check:
          id: nginx_http_redirected_to_https
          name: "4.1.1 Ensure HTTP is redirected to HTTPS"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_https_redirection_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_https_redirection_check] }}"
      changed_when: false

    # 4.1.1 Ensure HTTP is redirected to HTTPS | Remediation
    - name: "4.1.1 Ensure HTTP is redirected to HTTPS | Remediation"
      debug:
        msg:
        - "Edit your web server or proxy configuration file to redirect all unencrypted listening ports, such as port 80, through the return directive."
        - "Every server block listening on an unencrypted port must return a redirection to its HTTPS counterpart, for example:"
        - "server { listen 80; server_name cisecurity.org; return 301 https://$host$request_uri; }"
        - "The server_name and the target scheme are site specific, so the redirection is not written automatically."
      when: not audit_only and not nginx_https_redirection_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 4.1.2 Ensure a trusted certificate and trust chain is installed
  #
  # Certificates and their trust chains are needed to establish the identity of a web server
  # as legitimate and trusted. Certificate authorities validate a web server's identity and
  # that you are the owner of that web server domain name. The certificate file referenced
  # by ssl_certificate must contain the full chain: the server certificate, the intermediate
  # certificates and the certificate authority root certificate.
  - name: "4.1.2 Ensure a trusted certificate and trust chain is installed"
    block:
    # 4.1.2 Ensure a trusted certificate and trust chain is installed | Audit
    - name: "4.1.2 Ensure a trusted certificate and trust chain is installed | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          certificates=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*ssl_certificate[[:space:]]' || true)
          if [ -z "$certificates" ]; then
              certificates=$(grep -rhsE '^[[:space:]]*ssl_certificate[[:space:]]' /etc/nginx 2>/dev/null || true)
          fi
          if [ -z "$certificates" ]; then echo 'not_configured'; exit 0; fi
          chain_status='not_configured'
          for certificate_path in $(echo "$certificates" | awk '{print $2}' | sed -e 's/[;]//g'); do
              if [ -f "$certificate_path" ] && [ "$(grep -c 'BEGIN CERTIFICATE' "$certificate_path" 2>/dev/null || echo 0)" -ge 2 ]; then
                  chain_status='configured'
              else
                  chain_status='not_configured'
                  break
              fi
          done
          echo "$chain_status"
      changed_when: false
      register: nginx_trusted_certificate_status

    # Extract audit result
    - set_fact:
        nginx_trusted_certificate_check:
          id: nginx_trusted_certificate_installed
          name: "4.1.2 Ensure a trusted certificate and trust chain is installed"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_trusted_certificate_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_trusted_certificate_check] }}"
      changed_when: false

    # 4.1.2 Ensure a trusted certificate and trust chain is installed | Remediation
    - name: "4.1.2 Ensure a trusted certificate and trust chain is installed | Remediation"
      debug:
        msg:
        - "Step 1: create the server private key and a certificate signing request: openssl req -new -newkey rsa:4096 -keyout nginx.key -out nginx.csr"
        - "Step 2: submit the certificate signing request to your certificate authority and obtain the signed certificate together with its full trust chain in .pem format."
        - "Step 3: install the certificate and the signing chain, then reference them from the server block with ssl_certificate and ssl_certificate_key."
        - "server { listen 443 ssl; ssl_certificate /etc/nginx/cert.pem; ssl_certificate_key /etc/nginx/nginx.key; }"
        - "The certificate file must contain the server certificate, the intermediate certificates and the certificate authority root certificate."
        - "Restart nginx once the files are in place: systemctl restart nginx"
      when: not audit_only and not nginx_trusted_certificate_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 4.1.3 Ensure private key permissions are restricted
  #
  # The server's and potentially its vhost's private keys should be protected from
  # unauthorized access by limiting access based on the principle of least privilege.
  # Key files under /etc/nginx must carry mode 400 or more restrictive.
  - name: "4.1.3 Ensure private key permissions are restricted"
    block:
    # 4.1.3 Ensure private key permissions are restricted | Audit
    - name: "4.1.3 Ensure private key permissions are restricted | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          excessive=$(find /etc/nginx -type f -name '*.key' -perm /0377 2>/dev/null || true)
          if [ -n "$excessive" ]; then
              echo 'not_configured'
          else
              echo 'configured'
          fi
      changed_when: false
      register: nginx_private_keys_permissions_status

    # 4.1.3 Ensure private key permissions are restricted | Audit
    - name: "4.1.3 Ensure private key permissions are restricted | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then exit 0; fi
          find /etc/nginx -type f -name '*.key' -perm /0377 2>/dev/null || true
      changed_when: false
      register: nginx_private_keys_permissions_files

    # Extract audit result
    - set_fact:
        nginx_private_keys_permissions_check:
          id: nginx_private_key_permissions_restricted
          name: "4.1.3 Ensure private key permissions are restricted"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_private_keys_permissions_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_private_keys_permissions_check] }}"
      changed_when: false

    # 4.1.3 Ensure private key permissions are restricted | Remediation
    - name: "4.1.3 Ensure private key permissions are restricted | Remediation"
      file:
        path: "{{ item }}"
        mode: "u-wx,go-rwx"
      loop: "{{ nginx_private_keys_permissions_files.stdout_lines | default([]) | list | unique }}"
      when: not audit_only and not nginx_private_keys_permissions_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 4.1.4 Ensure only modern TLS protocols are used
  #
  # Only modern TLS protocols should be enabled in NGINX for all client connections and
  # upstream connections. Removing legacy TLS and SSL protocols (SSL 3.0, TLS 1.0, 1.1
  # and 1.2), and enabling stable TLS protocols (TLS 1.3), ensures users are able to take
  # advantage of strong security capabilities and protects them from insecure legacy
  # protocols. Anything older than TLS 1.3, including TLS 1.2, is reported as
  # non-compliant.
  - name: "4.1.4 Ensure only modern TLS protocols are used"
    block:
    # 4.1.4 Ensure only modern TLS protocols are used | Audit
    - name: "4.1.4 Ensure only modern TLS protocols are used | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          protocols=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*(ssl_protocols|proxy_ssl_protocols)[[:space:]]' || true)
          if [ -z "$protocols" ]; then
              protocols=$(grep -rhsE '^[[:space:]]*(ssl_protocols|proxy_ssl_protocols)[[:space:]]' /etc/nginx 2>/dev/null || true)
          fi
          if [ -z "$protocols" ]; then echo 'not_configured'; exit 0; fi
          if echo "$protocols" | grep -qE '(SSLv2|SSLv3|TLSv1\.0|TLSv1\.1|TLSv1\.2|TLSv1[[:space:];])'; then
              echo 'not_configured'
          elif echo "$protocols" | grep -q 'TLSv1\.3'; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_modern_tls_status

    # 4.1.4 Ensure only modern TLS protocols are used | Audit
    - name: "4.1.4 Ensure only modern TLS protocols are used | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then exit 0; fi
          grep -rlsE '^[[:space:]]*(ssl_protocols|proxy_ssl_protocols)[[:space:]]' /etc/nginx 2>/dev/null || true
      changed_when: false
      register: nginx_modern_tls_files

    # 4.1.4 Ensure only modern TLS protocols are used | Audit
    - name: "4.1.4 Ensure only modern TLS protocols are used | Audit"
      shell:
        cmd: |
          if [ -f /etc/nginx/nginx.conf ]; then echo '/etc/nginx/nginx.conf'; fi
      changed_when: false
      register: nginx_modern_tls_main_conf

    # Extract audit result
    - set_fact:
        nginx_modern_tls_check:
          id: nginx_modern_tls_protocols_only
          name: "4.1.4 Ensure only modern TLS protocols are used"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_modern_tls_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_modern_tls_check] }}"
      changed_when: false

    # 4.1.4 Ensure only modern TLS protocols are used | Remediation
    - name: "4.1.4 Ensure only modern TLS protocols are used | Remediation"
      replace:
        path: "{{ item }}"
        regexp: 'ssl_protocols[^;]*;'
        replace: "ssl_protocols {{ tls_protocols | default(cis_defaults.tls_protocols) }};"
      loop: "{{ nginx_modern_tls_files.stdout_lines | default([]) | list | unique }}"
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_modern_tls_check.remediation_status

    # 4.1.4 Ensure only modern TLS protocols are used | Remediation
    - name: "4.1.4 Ensure only modern TLS protocols are used | Remediation"
      lineinfile:
        path: "{{ item }}"
        regexp: '^[\s]{0,}ssl_protocols[\s]{1,}'
        line: "\tssl_protocols {{ tls_protocols | default(cis_defaults.tls_protocols) }};"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      loop: "{{ nginx_modern_tls_main_conf.stdout_lines | default([]) | list | unique }}"
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_modern_tls_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 4.1.5 Disable weak ciphers
  #
  # The ssl_ciphers directive configures the available ciphers on the web server and the
  # proxy_ssl_ciphers directive configures the ciphers used for upstream connections.
  # Weak ciphers must not be negotiable. A TLS 1.3 only deployment mandates a small,
  # non-negotiable set of AEAD ciphers, and any remaining cipher list must not enable a
  # weak suite for the older protocol versions it still covers.
  - name: "4.1.5 Disable weak ciphers"
    block:
    # 4.1.5 Disable weak ciphers | Audit
    - name: "4.1.5 Disable weak ciphers | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          ciphers=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*(ssl_ciphers|proxy_ssl_ciphers)[[:space:]]' || true)
          if [ -z "$ciphers" ]; then
              ciphers=$(grep -rhsE '^[[:space:]]*(ssl_ciphers|proxy_ssl_ciphers)[[:space:]]' /etc/nginx 2>/dev/null || true)
          fi
          if [ -z "$ciphers" ]; then echo 'not_configured'; exit 0; fi
          weak=$(echo "$ciphers" | awk '{print $2}' | tr ':;' '\n\n' | grep -v '^!' | grep -iE '(NULL|RC2|RC4|MD5|DES|3DES|EXPORT|EXP|LOW|SEED|IDEA|PSK|ADH|AECDH|SSLv2)' || true)
          if [ -n "$weak" ]; then
              echo 'not_configured'
          else
              echo 'configured'
          fi
      changed_when: false
      register: nginx_weak_ciphers_status

    # 4.1.5 Disable weak ciphers | Audit
    - name: "4.1.5 Disable weak ciphers | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then exit 0; fi
          grep -rlsE '^[[:space:]]*(ssl_ciphers|proxy_ssl_ciphers)[[:space:]]' /etc/nginx 2>/dev/null || true
      changed_when: false
      register: nginx_weak_ciphers_files

    # 4.1.5 Disable weak ciphers | Audit
    - name: "4.1.5 Disable weak ciphers | Audit"
      shell:
        cmd: |
          if [ -f /etc/nginx/nginx.conf ]; then echo '/etc/nginx/nginx.conf'; fi
      changed_when: false
      register: nginx_weak_ciphers_main_conf

    # Extract audit result
    - set_fact:
        nginx_weak_ciphers_check:
          id: nginx_weak_ciphers_disabled
          name: "4.1.5 Disable weak ciphers"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_weak_ciphers_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_weak_ciphers_check] }}"
      changed_when: false

    # 4.1.5 Disable weak ciphers | Remediation
    - name: "4.1.5 Disable weak ciphers | Remediation"
      replace:
        path: "{{ item }}"
        regexp: 'ssl_ciphers[^;]*;'
        replace: "ssl_ciphers {{ ssl_ciphers.value | default(cis_defaults.ssl_ciphers.value) }};"
      loop: "{{ nginx_weak_ciphers_files.stdout_lines | default([]) | list | unique }}"
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_weak_ciphers_check.remediation_status

    # 4.1.5 Disable weak ciphers | Remediation
    - name: "4.1.5 Disable weak ciphers | Remediation"
      lineinfile:
        path: "{{ item }}"
        regexp: '^[\s]{0,}ssl_ciphers[\s]{1,}'
        line: "\tssl_ciphers {{ ssl_ciphers.value | default(cis_defaults.ssl_ciphers.value) }};"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      loop: "{{ nginx_weak_ciphers_main_conf.stdout_lines | default([]) | list | unique }}"
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_weak_ciphers_check.remediation_status

    # 4.1.5 Disable weak ciphers | Remediation
    - name: "4.1.5 Disable weak ciphers | Remediation"
      lineinfile:
        path: "{{ item }}"
        regexp: '^[\s]{0,}proxy_ssl_ciphers[\s]{1,}'
        line: "\tproxy_ssl_ciphers {{ ssl_ciphers.value | default(cis_defaults.ssl_ciphers.value) }};"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      loop: "{{ nginx_weak_ciphers_main_conf.stdout_lines | default([]) | list | unique }}"
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_weak_ciphers_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 4.1.6 Ensure awareness of TLS 1.3 new Diffie-Hellman parameters
  #
  # Custom Diffie-Hellman parameters are not applicable to a deployment that exclusively
  # uses TLS 1.3: the key exchange groups are negotiated by the protocol itself. The
  # ssl_dhparam directive is obsolete and must be removed from the configuration.
  - name: "4.1.6 Ensure awareness of TLS 1.3 new Diffie-Hellman parameters"
    block:
    # 4.1.6 Ensure awareness of TLS 1.3 new Diffie-Hellman parameters | Audit
    - name: "4.1.6 Ensure awareness of TLS 1.3 new Diffie-Hellman parameters | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          dhparam=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*ssl_dhparam[[:space:]]' || true)
          if [ -z "$dhparam" ]; then
              dhparam=$(grep -rhsE '^[[:space:]]*ssl_dhparam[[:space:]]' /etc/nginx 2>/dev/null || true)
          fi
          if [ -n "$dhparam" ]; then
              echo 'not_configured'
          else
              echo 'configured'
          fi
      changed_when: false
      register: nginx_tls13_dhparam_status

    # 4.1.6 Ensure awareness of TLS 1.3 new Diffie-Hellman parameters | Audit
    - name: "4.1.6 Ensure awareness of TLS 1.3 new Diffie-Hellman parameters | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then exit 0; fi
          grep -rlsE '^[[:space:]]*ssl_dhparam[[:space:]]' /etc/nginx 2>/dev/null || true
      changed_when: false
      register: nginx_tls13_dhparam_files

    # Extract audit result
    - set_fact:
        nginx_tls13_dhparam_check:
          id: nginx_tls13_dh_parameters_awareness
          name: "4.1.6 Ensure awareness of TLS 1.3 new Diffie-Hellman parameters"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_tls13_dhparam_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_tls13_dhparam_check] }}"
      changed_when: false

    # 4.1.6 Ensure awareness of TLS 1.3 new Diffie-Hellman parameters | Remediation
    - name: "4.1.6 Ensure awareness of TLS 1.3 new Diffie-Hellman parameters | Remediation"
      replace:
        path: "{{ item }}"
        regexp: '^([\s]{0,})(ssl_dhparam[\s]{1,}[^;]+[;])'
        replace: '\1# \2'
      loop: "{{ nginx_tls13_dhparam_files.stdout_lines | default([]) | list | unique }}"
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_tls13_dhparam_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled
  #
  # OCSP stapling allows a server to efficiently deliver certificate revocation information
  # to the client, improving performance and privacy. The server caches the OCSP response
  # from the Certificate Authority, eliminating the need for the client to make a separate
  # connection. ssl_stapling and ssl_stapling_verify must both be turned on, and the
  # supporting ssl_trusted_certificate and resolver directives must point at the trust
  # chain and at trusted DNS resolvers.
  - name: "4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled"
    block:
    # 4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled | Audit
    - name: "4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          stapling=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*ssl_stapling[[:space:]]+on[[:space:]]*;' || true)
          if [ -z "$stapling" ]; then
              stapling=$(grep -rhsE '^[[:space:]]*ssl_stapling[[:space:]]+on[[:space:]]*;' /etc/nginx 2>/dev/null || true)
          fi
          stapling_verify=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*ssl_stapling_verify[[:space:]]+on[[:space:]]*;' || true)
          if [ -z "$stapling_verify" ]; then
              stapling_verify=$(grep -rhsE '^[[:space:]]*ssl_stapling_verify[[:space:]]+on[[:space:]]*;' /etc/nginx 2>/dev/null || true)
          fi
          if [ -n "$stapling" ] && [ -n "$stapling_verify" ]; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_ssl_stapling_status

    # 4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled | Audit
    - name: "4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled | Audit"
      shell:
        cmd: |
          if [ -f /etc/nginx/nginx.conf ]; then echo '/etc/nginx/nginx.conf'; fi
      changed_when: false
      register: nginx_ssl_stapling_main_conf

    # Extract audit result
    - set_fact:
        nginx_ssl_stapling_check:
          id: nginx_ocsp_stapling_enabled
          name: "4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_ssl_stapling_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_ssl_stapling_check] }}"
      changed_when: false

    # 4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled | Remediation
    - name: "4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled | Remediation"
      lineinfile:
        path: "{{ item }}"
        regexp: '^[\s]{0,}ssl_stapling[\s]{1,}'
        line: "\tssl_stapling on;"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      loop: "{{ nginx_ssl_stapling_main_conf.stdout_lines | default([]) | list | unique }}"
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_ssl_stapling_check.remediation_status

    # 4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled | Remediation
    - name: "4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled | Remediation"
      lineinfile:
        path: "{{ item }}"
        regexp: '^[\s]{0,}ssl_stapling_verify[\s]{1,}'
        line: "\tssl_stapling_verify on;"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      loop: "{{ nginx_ssl_stapling_main_conf.stdout_lines | default([]) | list | unique }}"
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_ssl_stapling_check.remediation_status

    # 4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled | Remediation
    - name: "4.1.7 Ensure Online Certificate Status Protocol (OCSP) stapling is enabled | Remediation"
      debug:
        msg:
        - "Request the OCSP Must-Staple extension when the certificate is issued."
        - "Complete the stapling configuration with the two site specific directives that cannot be derived automatically:"
        - "ssl_trusted_certificate /etc/nginx/ssl/full_chain.pem;   # root and intermediate certificates used for verification"
        - "resolver 8.8.8.8 1.1.1.1 valid=300s;                     # trusted DNS resolvers used to reach the OCSP responder"
      when: not audit_only and not nginx_ssl_stapling_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 4.1.8 Ensure HTTP Strict Transport Security (HSTS) is enabled
  #
  # HTTP Strict Transport Security instructs browsers to communicate with a domain
  # exclusively over HTTPS. A comprehensive policy carries a max-age of at least
  # 31536000 seconds (one year, two years being the recommended value), the
  # includeSubDomains directive so the policy covers every current and future subdomain,
  # and the always parameter so the header is emitted on every response.
  - name: "4.1.8 Ensure HTTP Strict Transport Security (HSTS) is enabled"
    block:
    # 4.1.8 Ensure HTTP Strict Transport Security (HSTS) is enabled | Audit
    - name: "4.1.8 Ensure HTTP Strict Transport Security (HSTS) is enabled | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          header=$(nginx -T 2>/dev/null | grep -i 'Strict-Transport-Security' | grep -vE '^[[:space:]]*#' | tail -n 1 || true)
          if [ -z "$header" ]; then
              header=$(grep -rhsi 'Strict-Transport-Security' /etc/nginx 2>/dev/null | grep -vE '^[[:space:]]*#' | tail -n 1 || true)
          fi
          if [ -z "$header" ]; then echo 'not_configured'; exit 0; fi
          max_age=$(echo "$header" | sed -n 's/.*[Mm]ax-[Aa]ge=\([0-9]\{1,\}\).*/\1/p')
          if [ -z "$max_age" ]; then echo 'not_configured'; exit 0; fi
          if [ "$max_age" -ge 31536000 ] && echo "$header" | grep -qi 'includeSubDomains' && echo "$header" | grep -qE '[[:space:]]always[[:space:]]*;'; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_hsts_status

    # 4.1.8 Ensure HTTP Strict Transport Security (HSTS) is enabled | Audit
    - name: "4.1.8 Ensure HTTP Strict Transport Security (HSTS) is enabled | Audit"
      shell:
        cmd: |
          if [ -f /etc/nginx/nginx.conf ]; then echo '/etc/nginx/nginx.conf'; fi
      changed_when: false
      register: nginx_hsts_main_conf

    # Extract audit result
    - set_fact:
        nginx_hsts_check:
          id: nginx_hsts_enabled
          name: "4.1.8 Ensure HTTP Strict Transport Security (HSTS) is enabled"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_hsts_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_hsts_check] }}"
      changed_when: false

    # 4.1.8 Ensure HTTP Strict Transport Security (HSTS) is enabled | Remediation
    - name: "4.1.8 Ensure HTTP Strict Transport Security (HSTS) is enabled | Remediation"
      lineinfile:
        path: "{{ item }}"
        regexp: '[#]{0,}[\s]{0,}add_header[\s]{1,}Strict-Transport-Security.+[;]'
        state: absent
      loop: "{{ nginx_hsts_main_conf.stdout_lines | default([]) | list | unique }}"
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_hsts_check.remediation_status

    # 4.1.8 Ensure HTTP Strict Transport Security (HSTS) is enabled | Remediation
    - name: "4.1.8 Ensure HTTP Strict Transport Security (HSTS) is enabled | Remediation"
      lineinfile:
        path: "{{ item }}"
        regexp: '^[\s]{0,}add_header[\s]{1,}Strict-Transport-Security'
        line: "\tadd_header Strict-Transport-Security \"max-age={{ strict_transport_security_max_age | default(cis_defaults.strict_transport_security_max_age) }}; includeSubDomains\" always;"
        insertafter: '^([^#.]){0,}http\s{0,}\{'
        state: present
      loop: "{{ nginx_hsts_main_conf.stdout_lines | default([]) | list | unique }}"
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_hsts_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 4.1.9 Ensure upstream server traffic is authenticated with a client certificate
  #
  # In a reverse proxy configuration, NGINX acts as a client when communicating with an
  # upstream server. Mutual TLS secures that server to server connection: NGINX presents
  # its own client certificate through proxy_ssl_certificate and
  # proxy_ssl_certificate_key, and the upstream server authenticates the proxy from that
  # certificate. The upstream side of the audit is outside the scope of the NGINX
  # configuration.
  - name: "4.1.9 Ensure upstream server traffic is authenticated with a client certificate"
    block:
    # 4.1.9 Ensure upstream server traffic is authenticated with a client certificate | Audit
    - name: "4.1.9 Ensure upstream server traffic is authenticated with a client certificate | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          client_certificate=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*proxy_ssl_certificate[[:space:]]' || true)
          if [ -z "$client_certificate" ]; then
              client_certificate=$(grep -rhsE '^[[:space:]]*proxy_ssl_certificate[[:space:]]' /etc/nginx 2>/dev/null || true)
          fi
          client_certificate_key=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*proxy_ssl_certificate_key[[:space:]]' || true)
          if [ -z "$client_certificate_key" ]; then
              client_certificate_key=$(grep -rhsE '^[[:space:]]*proxy_ssl_certificate_key[[:space:]]' /etc/nginx 2>/dev/null || true)
          fi
          if [ -n "$client_certificate" ] && [ -n "$client_certificate_key" ]; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_proxy_client_certificate_status

    # Extract audit result
    - set_fact:
        nginx_proxy_client_certificate_check:
          id: nginx_upstream_client_certificate_auth
          name: "4.1.9 Ensure upstream server traffic is authenticated with a client certificate"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_proxy_client_certificate_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_proxy_client_certificate_check] }}"
      changed_when: false

    # 4.1.9 Ensure upstream server traffic is authenticated with a client certificate | Remediation
    - name: "4.1.9 Ensure upstream server traffic is authenticated with a client certificate | Remediation"
      debug:
        msg:
        - "Step 1: configure the upstream server to request and verify client certificates against your certificate authority: ssl_client_certificate /path/to/my-ca.crt; ssl_verify_client on;"
        - "Step 2: create a key and a certificate signing request for the proxy, then sign the request with that certificate authority."
        - "openssl genrsa -out nginx-client.key 4096 && openssl req -new -key nginx-client.key -out nginx-client.csr"
        - "openssl x509 -req -in nginx-client.csr -CA my-ca.crt -CAkey my-ca.key -CAcreateserial -out nginx-client.crt -days 365"
        - "Step 3: present the client certificate from the proxying location block:"
        - "location /api/ { proxy_pass https://your-upstream-server; proxy_ssl_certificate /etc/nginx/ssl/nginx-client.crt; proxy_ssl_certificate_key /etc/nginx/ssl/nginx-client.key; }"
        - "The certificate authority, the certificate paths and the protected location blocks are site specific, so they are not written automatically."
      when: not audit_only and not nginx_proxy_client_certificate_check.remediation_status
    tags:
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 4.1.10 Ensure the upstream traffic server certificate is trusted
  #
  # When acting as a reverse proxy, NGINX must validate the identity of the upstream
  # server by verifying its certificate against a trusted certificate authority. Verification
  # is enabled with proxy_ssl_verify on and the trusted authority is supplied through
  # proxy_ssl_trusted_certificate, while proxy_ssl_name pins the hostname the
  # certificate is checked against.
  - name: "4.1.10 Ensure the upstream traffic server certificate is trusted"
    block:
    # 4.1.10 Ensure the upstream traffic server certificate is trusted | Audit
    - name: "4.1.10 Ensure the upstream traffic server certificate is trusted | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          trusted_certificate=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*proxy_ssl_trusted_certificate[[:space:]]' || true)
          if [ -z "$trusted_certificate" ]; then
              trusted_certificate=$(grep -rhsE '^[[:space:]]*proxy_ssl_trusted_certificate[[:space:]]' /etc/nginx 2>/dev/null || true)
          fi
          verification=$(nginx -T 2>/dev/null | grep -E '^[[:space:]]*proxy_ssl_verify[[:space:]]+on[[:space:]]*;' || true)
          if [ -z "$verification" ]; then
              verification=$(grep -rhsE '^[[:space:]]*proxy_ssl_verify[[:space:]]+on[[:space:]]*;' /etc/nginx 2>/dev/null || true)
          fi
          if [ -n "$trusted_certificate" ] && [ -n "$verification" ]; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_upstream_certificate_trusted_status

    # Extract audit result
    - set_fact:
        nginx_upstream_certificate_trusted_check:
          id: nginx_upstream_server_certificate_trusted
          name: "4.1.10 Ensure the upstream traffic server certificate is trusted"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_upstream_certificate_trusted_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_upstream_certificate_trusted_check] }}"
      changed_when: false

    # 4.1.10 Ensure the upstream traffic server certificate is trusted | Remediation
    - name: "4.1.10 Ensure the upstream traffic server certificate is trusted | Remediation"
      debug:
        msg:
        - "Obtain the certificate authority certificate that signed the upstream server certificate and place it in a secure directory, for example /etc/nginx/ssl/upstream_ca.crt."
        - "In every location block that proxies traffic, add the verification directives:"
        - "proxy_ssl_verify on;"
        - "proxy_ssl_trusted_certificate /etc/nginx/ssl/upstream_ca.crt;"
        - "proxy_ssl_name your-upstream-hostname.com;   # must match the hostname used in proxy_pass"
        - "The certificate authority file and the upstream hostname are site specific, so they are not written automatically."
      when: not audit_only and not nginx_upstream_certificate_trusted_check.remediation_status
    tags:
    - "load_balancer_level_2"
    - "reverse_proxy_level_2"
    when: |
          ('load_balancer_level_2' in levels)
          or ('reverse_proxy_level_2' in levels)



  # 4.1.11 Ensure Secure Session Resumption is Enabled
  #
  # TLS 1.3 introduces a secure session resumption mechanism using pre-shared keys that
  # significantly reduces handshake latency for returning clients without weakening the
  # session. Session tickets are on by default, so ssl_session_tickets must not be turned
  # off; the recommended state is for the directive to be absent entirely.
  - name: "4.1.11 Ensure Secure Session Resumption is Enabled"
    block:
    # 4.1.11 Ensure Secure Session Resumption is Enabled | Audit
    - name: "4.1.11 Ensure Secure Session Resumption is Enabled | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          disabled=$(grep -rhsiE '^[[:space:]]*ssl_session_tickets[[:space:]]+off[[:space:]]*;' /etc/nginx 2>/dev/null || true)
          if [ -z "$disabled" ]; then
              disabled=$(nginx -T 2>/dev/null | grep -iE '^[[:space:]]*ssl_session_tickets[[:space:]]+off[[:space:]]*;' || true)
          fi
          if [ -n "$disabled" ]; then
              echo 'not_configured'
          else
              echo 'configured'
          fi
      changed_when: false
      register: nginx_session_resumption_status

    # 4.1.11 Ensure Secure Session Resumption is Enabled | Audit
    - name: "4.1.11 Ensure Secure Session Resumption is Enabled | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then exit 0; fi
          grep -rlsiE '^[[:space:]]*ssl_session_tickets[[:space:]]+off[[:space:]]*;' /etc/nginx 2>/dev/null || true
      changed_when: false
      register: nginx_session_resumption_files

    # Extract audit result
    - set_fact:
        nginx_session_resumption_check:
          id: nginx_secure_session_resumption_enabled
          name: "4.1.11 Ensure Secure Session Resumption is Enabled"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_session_resumption_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_session_resumption_check] }}"
      changed_when: false

    # 4.1.11 Ensure Secure Session Resumption is Enabled | Remediation
    - name: "4.1.11 Ensure Secure Session Resumption is Enabled | Remediation"
      replace:
        path: "{{ item }}"
        regexp: '^([\s]{0,})(ssl_session_tickets[\s]{1,}off[\s]{0,}[;])'
        replace: '\1# \2'
      loop: "{{ nginx_session_resumption_files.stdout_lines | default([]) | list | unique }}"
      notify:
      - "restart nginx"
      - "config test"
      when: not audit_only and not nginx_session_resumption_check.remediation_status
    tags:
    - "web_server_level_1"
    - "load_balancer_level_1"
    - "reverse_proxy_level_1"
    when: |
          ('web_server_level_1' in levels or 'web_server_level_2' in levels)
          or ('load_balancer_level_1' in levels or 'load_balancer_level_2' in levels)
          or ('reverse_proxy_level_1' in levels or 'reverse_proxy_level_2' in levels)



  # 4.1.12 Ensure HTTP/3.0 is used
  #
  # HTTP/3 operates over the QUIC protocol, which is built on UDP, to solve head of line
  # blocking, reduce connection setup time and improve performance on unreliable
  # networks. It requires a UDP listener carrying the quic parameter, an Alt-Svc header
  # advertising h3 availability to browsers, and ssl_early_data on. The binary must be
  # built with the http_v3 module and UDP traffic must be allowed on the listening port.
  - name: "4.1.12 Ensure HTTP/3.0 is used"
    block:
    # 4.1.12 Ensure HTTP/3.0 is used | Audit
    - name: "4.1.12 Ensure HTTP/3.0 is used | Audit"
      shell:
        cmd: |
          if [ ! -d /etc/nginx ]; then echo 'not_configured'; exit 0; fi
          configuration=$(nginx -T 2>/dev/null || true)
          if [ -z "$configuration" ]; then
              configuration=$(grep -rhs -e 'listen' -e 'Alt-Svc' -e 'ssl_early_data' /etc/nginx 2>/dev/null || true)
          fi
          if [ -z "$configuration" ]; then echo 'not_configured'; exit 0; fi
          quic_listeners=$(echo "$configuration" | grep -E '^[[:space:]]*listen[[:space:]]+[^;]*quic' || true)
          alt_svc=$(echo "$configuration" | grep -iE '^[[:space:]]*add_header[[:space:]]+Alt-Svc' | grep -i 'h3=' || true)
          early_data=$(echo "$configuration" | grep -E '^[[:space:]]*ssl_early_data[[:space:]]+on[[:space:]]*;' || true)
          if [ -n "$quic_listeners" ] && echo "$quic_listeners" | grep -q 'reuseport' && [ -n "$alt_svc" ] && [ -n "$early_data" ]; then
              echo 'configured'
          else
              echo 'not_configured'
          fi
      changed_when: false
      register: nginx_http3_status

    # Extract audit result
    - set_fact:
        nginx_http3_check:
          id: nginx_http3_used
          name: "4.1.12 Ensure HTTP/3.0 is used"
          scored: true
          automated: false
          remediation_status: "{{ true if nginx_http3_status.stdout == 'configured' else false }}"
      changed_when: false

    # Appending audit result
    - set_fact:
        audit_result: "{{ (audit_result | default([])) + [nginx_http3_check] }}"
      changed_when: false

    # 4.1.12 Ensure HTTP/3.0 is used | Remediation
    - name: "4.1.12 Ensure HTTP/3.0 is used | Remediation"
      debug:
        msg:
        - "Prerequisite: the running binary must be compiled with the --with-http_v3_module flag, and the firewall must allow UDP traffic on port 443."
        - "In the main server block of the HTTPS site, add the following directives:"
        - "listen 443 quic reuseport;"
        - "listen [::]:443 quic reuseport;"
        - "add_header Alt-Svc 'h3=\":443\"; ma=63072000';"
        - "ssl_early_data on;"
        - "Enabling QUIC changes the transport offered to clients and depends on the build of the installed binary, so it is not enabled automatically."
      when: not audit_only and not nginx_http3_check.remediation_status
    tags:
    - "web_server_level_2"
    when: "'web_server_level_2' in levels"
