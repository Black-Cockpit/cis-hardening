# defaults file for cis_hardening
audit_result: []
reboot_required: false

# Remediation will not be applied unless the audit_only is set to false
audit_only: true

# Benchmark level
# Allowed values are `server_level_1`, `server_level_2`, `workstation_level_1` or `workstation_level_2`
levels:
- workstation_level_1
- workstation_level_2

# Benchmark mapping per distribution. Each entry names a file under
# vars/benchmarks/. Override benchmark_mapping directly to force one.
default_benchmark_mapping:
  RedHat:
    "8": rhel8_v4
    "10": rhel10_v1
  Rocky:
    "8": rocky8_v2
    "10": rocky10_v1
  AlmaLinux:
    "8": almalinux8_v4
    "10": almalinux10_v1
  OracleLinux:
    "8": oracle8_v4
    "10": oracle10_v1
  CentOS:
    "8": centos8_v2
    "10": centos10_v1

# Warning Banner Content (issue, issue.net, motd)
warning_banner: "Authorized uses only. All activity may be monitored and reported."

# Define site policy
site_policy:

cis_defaults:
  # Time synchronization ntp servers
  time_synchronization_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
  - 3.pool.ntp.org
  # Chrony server options
  chrony_server_options: "minpoll 8"

  # sshd default
  sshd:
    client_alive_interval: 45
    client_alive_count_max: 3
    login_grace_time: 60
    log_level: INFO
    auth_max_retry: 4
    max_startups:
      start: 10
      rate: 30
      full: 60

  audit_tools:
  - "/sbin/auditctl"
  - "/sbin/aureport"
  - "/sbin/ausearch"
  - "/sbin/autrace"
  - "/sbin/auditd"
  - "/sbin/augenrules"

