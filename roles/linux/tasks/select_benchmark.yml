# Select which benchmark mapping applies to this host and load it.
# benchmark_mapping can be set by the user to force a specific benchmark.
# The mapping is keyed by distribution and major version, because RHEL 8 and
# RHEL 10 (and Rocky 8 and 10) share the same ansible_facts['distribution'] value.
- name: "Select benchmark | Resolve mapping for {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
  set_fact:
    benchmark_mapping: "{{ benchmark_mapping | default((default_benchmark_mapping[ansible_facts['distribution']] | default({}))[ansible_facts['distribution_major_version']] | default('rocky8_v2')) }}"

# Load the selected benchmark mapping (rules, numbers, titles, levels). Each
# benchmark lives under its owning distribution's directory; first_found locates
# it by name across all of them so a forced benchmark_mapping that belongs to
# another distribution still resolves.
- name: "Select benchmark | Load {{ benchmark_mapping }} mapping"
  include_vars:
    file: "{{ lookup('ansible.builtin.first_found', benchmark_find) }}"
  vars:
    benchmark_find:
      files:
        - "{{ benchmark_mapping }}.yml"
      paths:
        - "{{ role_path }}/vars/RedHat/benchmarks"
        - "{{ role_path }}/vars/Rocky/benchmarks"
        - "{{ role_path }}/vars/AlmaLinux/benchmarks"
        - "{{ role_path }}/vars/OracleLinux/benchmarks"
        - "{{ role_path }}/vars/CentOS/benchmarks"

# Load the check id to topic directory lookup
- name: "Select benchmark | Load check topic lookup"
  include_vars:
    file: "check_topics.yml"
