# can_kernel_module_not_available
#
# The Controller Area Network (CAN) is a serial communications protocol, which was
# initially developed for automotive and is now also used in marine, industrial, and
# medical applications. Disabling CAN protects the system against exploitation of any
# flaws in its implementation.

- name: "can_kernel_module_not_available | Audit"
  shell:
    cmd: modprobe -nqv can && echo loaded || echo not_loaded
  changed_when: false
  register: can_check_loaded_result
# Check if module is disabled
- name: "can_kernel_module_not_available | Audit"
  shell:
    cmd: grep -r -E "^(#)?install can /bin/(true|false)" /etc/modprobe.d/ > /dev/null && echo disabled || echo not_disabled
  changed_when: false
  register: can_check_disabled_result
# Check if module is blacklisted
- name: "can_kernel_module_not_available | Audit"
  shell:
    cmd: grep -r -E "^(#)?blacklist can" /etc/modprobe.d/ > /dev/null && echo blacklisted || echo not_blacklisted
  changed_when: false
  register: can_check_blacklisted_result

# Extract audit result
- set_fact:
    can_check:
      remediation_status: "{{ true if (can_check_loaded_result.stdout == 'not_loaded' or (can_check_disabled_result.stdout == 'disabled' and can_check_blacklisted_result.stdout == 'blacklisted')) else false }}"
  changed_when: false

# Remediation | Enforce the required configuration line
- name: "can_kernel_module_not_available | Remediation"
  lineinfile:
    path: "/etc/modprobe.d/can.conf"
    regexp: "^(#)?install can(\\s|$)"
    line: "install can /bin/false"
    create: true
    mode: "0600"
  when: not audit_only and not can_check.remediation_status

# Remediation | Enforce the required configuration line
- name: "can_kernel_module_not_available | Remediation"
  lineinfile:
    path: /etc/modprobe.d/blacklist.conf
    regexp: "^(#)?blacklist can(\\s|$)"
    line: "blacklist can"
    create: true
    mode: "0600"
  when: not audit_only and not can_check.remediation_status

# Unload the can module
- name: "can_kernel_module_not_available | Remediation"
  modprobe:
    name: can
    state: absent
  when: not audit_only and not can_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ can_check.remediation_status }}"
