# core_dump_storage_disabled
#
# A core dump is the memory of an executable program. It is generally used to determine
# why a program aborted. It can also be used to glean confidential information from a core
# file.

- name: "core_dump_storage_disabled | Audit"
  shell:
    cmd: "[[ -f /usr/bin/systemd-analyze ]] &&  /usr/bin/systemd-analyze cat-config /etc/systemd/coredump.conf | grep -E \"^#\\s\/.*\\.conf\" | awk '{print $2}'"
  changed_when: false
  register: core_dump_conf_files_list

# Check if one of core dump configuration files has Storage=none inside its
# [Coredump] section; directives outside the section are ignored by systemd,
# so only lines within the block count
- name: "core_dump_storage_disabled | Audit"
  shell:
    cmd: 'awk "/\[Coredump\]/{a=1;next}/\[/{a=0}a" {{ item }} 2>/dev/null | grep -Eq "^\s{0,}Storage\s{0,}=\s{0,}none" && echo exists || echo not_exists'
  changed_when: false
  register: core_dump_storage_conf_files_check
  loop: "{{ core_dump_conf_files_list.stdout_lines | list }}"

# Set core dump storage configuration compliance tracker
- set_fact:
    core_dump_storage_configured: false
  changed_when: false

# Check if core dump storage is configured in one of the core dump listed files
- set_fact:
    core_dump_storage_configured: "{{ true if (core_dump_storage_configured or item.stdout == 'exists') else false }}"
  changed_when: false
  loop_control:
    label: "{{ item.stdout }}"
  loop: "{{ core_dump_storage_conf_files_check.results | list }}"

# Extract audit result
- set_fact:
    core_dump_storage_configured_check: 
      remediation_status: "{{ true if core_dump_storage_configured  else false }}" 
  changed_when: false

# Remediation | Comment out Storage lines in coredump drop-ins whose
# [Coredump] block sets a value other than none, so no drop-in overrides the
# enforced value
- name: "core_dump_storage_disabled | Remediation"
  shell:
    cmd: |
      if [ -d /etc/systemd/coredump.conf.d ]; then
          for conf_file in /etc/systemd/coredump.conf.d/*.conf; do
              [ -e "$conf_file" ] || continue
              awk '/\[Coredump\]/{a=1;next}/\[/{a=0}a' "$conf_file" 2>/dev/null | \
              grep -Poi '\h*Storage\h*=\h*\H+\b' | \
              grep -Pivq '^\h*Storage\h*=\h*none\b' && \
              sed -ri '/^\s*[Ss]torage\s*=/s/^/# /' "$conf_file"
          done
      fi
      true
  when: not audit_only and not core_dump_storage_configured_check.remediation_status

# Remediation | Ensure the [Coredump] section header opens the file, otherwise
# systemd ignores every directive written below
- name: "core_dump_storage_disabled | Remediation"
  lineinfile:
    path: "/etc/systemd/coredump.conf"
    line: "[Coredump]"
    regexp: '^\[Coredump\]'
    insertbefore: BOF
    state: present
    create: true
    mode: "0644"
    owner: root
    group: root
  when: not audit_only and not core_dump_storage_configured_check.remediation_status

# Stat the coredump config so the in-place replace is skipped when the
# file does not exist (the lineinfile below creates it)
- name: "core_dump_storage_disabled | Remediation"
  stat:
    path: "/etc/systemd/coredump.conf"
  changed_when: false
  register: coredump_conf_stat
  when: not audit_only and not core_dump_storage_configured_check.remediation_status

# Appending audit result
- name: "core_dump_storage_disabled | Remediation"
  replace:
    name: "/etc/systemd/coredump.conf"
    regexp: "^[#]{0,}(Storage=).+"
    replace: "Storage=none"
  when: not audit_only and not core_dump_storage_configured_check.remediation_status and coredump_conf_stat.stat.exists

# core_dump_storage_disabled | Remediation
- name: "core_dump_storage_disabled | Remediation"
  lineinfile:
    path: "/etc/systemd/coredump.conf"
    line: "Storage=none"
    state: present
    regexp: "^Storage=none"
    create: true
    mode: "0644"
    owner: root
    group: root
  when: not audit_only and not core_dump_storage_configured_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ core_dump_storage_configured_check.remediation_status }}"
