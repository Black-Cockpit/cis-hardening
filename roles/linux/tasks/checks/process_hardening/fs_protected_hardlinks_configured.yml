# fs_protected_hardlinks_configured
#
# fs.protected_hardlinks Controls the creation of hard links to files.
# By enabling the fs.protected_hardlinks kernel parameter, users can no longer
# create soft or hard links to files they do not own.

- name: "fs_protected_hardlinks_configured | Audit"
  shell:
    cmd: |
      running="$(sysctl -n fs.protected_hardlinks 2>/dev/null)"
      persisted="$(grep -hEs "^\s*fs[.]protected_hardlinks\s*=" {{ sysctl_conf_files | join(' ') }} 2>/dev/null | tail -1 | awk -F= '{print $2}' | tr -d "[:space:]")"
      [ "$running" = "1" ] && [ "$persisted" = "1" ] && echo configured || echo not_configured
  changed_when: false
  register: fs_protected_hardlinks_status

# Extract audit result
- set_fact:
    fs_protected_hardlinks_check:
      remediation_status: "{{ true if fs_protected_hardlinks_status.stdout == 'configured' else false }}"
  changed_when: false

# Remediation | Enforce the required kernel parameter
- name: "fs_protected_hardlinks_configured | Remediation"
  ansible.posix.sysctl:
    name: fs.protected_hardlinks
    value: 1
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not fs_protected_hardlinks_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ fs_protected_hardlinks_check.remediation_status }}"
