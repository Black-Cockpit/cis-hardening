# journald_not_configured_send_logs_rsyslog
#
# Data from journald should be kept in the confines of the service and not forwarded to
# other services.
#
# This recommendation is the alternative to forwarding journald logs to rsyslog:
# it applies only when journald is the preferred log-capture method. When rsyslog
# is the preferred method (the default assumed by the rsyslog section, which sets
# ForwardToSyslog=yes), this recommendation is skipped. The check is therefore
# advisory: it reports the current state and applies no change, so it never
# conflicts with journald_configured_send_logs_rsyslog.

# Enumerate the effective journald config files (main file plus any drop-ins)
- name: "journald_not_configured_send_logs_rsyslog | Audit"
  shell:
    cmd: |
      while IFS= read -r file_name; do
          echo "${file_name//# /}"
      done <<<$(/usr/bin/systemd-analyze cat-config "/etc/systemd/journald.conf" | grep -E '[#]{0,}\/.*conf')
  changed_when: false
  register: journald_conf_files_list

# Determine whether ForwardToSyslog is enabled in any effective config file
- name: "journald_not_configured_send_logs_rsyslog | Audit"
  shell:
    cmd: |
      grep -E '^ForwardToSyslog' "{{ item }}" | awk -F '=' '{print $2}' | grep -q 'yes' && \
      echo 'forward_enabled' || echo 'forward_disabled'
  changed_when: false
  loop: "{{ journald_conf_files_list.stdout_lines | default([]) }}"
  register: journald_forward_status_check

# Reset the accumulator before evaluating the per-file results
- set_fact:
    journald_forward_enabled: false
  changed_when: false

# Forwarding is considered enabled if any effective config file sets it to yes
- set_fact:
    journald_forward_enabled: "{{ true if (journald_forward_enabled or item.stdout == 'forward_enabled') else false }}"
  loop: "{{ journald_forward_status_check.results | default([]) | list }}"
  loop_control:
    label: "{{ item.stdout | default() }}"
  changed_when: false

# Compliant (forwarding disabled) when no effective config forwards to syslog
- set_fact:
    journald_forward_disabled_check:
      remediation_status: "{{ true if not journald_forward_enabled else false }}"
  changed_when: false

# Advisory only: this recommendation is skipped when rsyslog is the preferred
# log method, so no change is applied here
- name: "journald_not_configured_send_logs_rsyslog | Remediation"
  debug:
    msg: "Skipped: rsyslog is the preferred log method (ForwardToSyslog=yes). To harden a journald-only host, set ForwardToSyslog=no in the [Journal] section of /etc/systemd/journald.conf or a drop-in under /etc/systemd/journald.conf.d/"
  when: not audit_only and not journald_forward_disabled_check.remediation_status
  changed_when: false

# Expose the advisory to the report
- set_fact:
    check_extra: "{{ {'remediation': 'Not applicable when rsyslog is the preferred log method (ForwardToSyslog=yes per the rsyslog section). For a journald-only host, set ForwardToSyslog=no in the [Journal] section of /etc/systemd/journald.conf or a drop-in under /etc/systemd/journald.conf.d/.'} }}"
  changed_when: false
  when: not journald_forward_disabled_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ journald_forward_disabled_check.remediation_status }}"
