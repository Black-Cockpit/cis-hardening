# nftables_base_chains_exist
#
# Chains are containers for rules. They exist in two kinds, base chains and regular chains.
# A base chain is an entry point for packets from the networking stack, a regular chain
# may be used as jump target and is used for better rule organization.

- set_fact:
    nftables_base_chain_check:
      name: "nftables_base_chains_exist"
      scored: false
      automated: true
  changed_when: false

# Appending audit result

# Manual/advisory rule: the benchmark marks it unscored/manual, so there is
# no automated pass/fail. Report it as not-a-failure and let the operator
# review the recommendation in the task output.
- set_fact:
    check_compliant: true
