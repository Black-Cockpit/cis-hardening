# firewalld_active_zone_target_configured
#
# An active firewalld zone must exist and its target must not be set to ACCEPT
# for interfaces that are not loopback or virtual, so unsolicited traffic is
# not accepted by default.

- name: "firewalld_active_zone_target_configured | Audit"
  shell:
    cmd: |
      active_zones="$(firewall-cmd --get-active-zones 2>/dev/null | awk 'NR % 2 == 1 {print $1}')"
      [ -z "$active_zones" ] && { echo not_configured; exit 0; }
      for zone_name in $active_zones; do
        interfaces="$(firewall-cmd --zone="$zone_name" --list-interfaces 2>/dev/null | tr ' ' '\n' | grep -vE '^(lo|virbr|docker|veth|)$' || true)"
        [ -z "$interfaces" ] && continue
        runtime_target="$(firewall-cmd --zone="$zone_name" --get-target 2>/dev/null)"
        permanent_target="$(firewall-cmd --permanent --zone="$zone_name" --get-target 2>/dev/null)"
        if [ "$runtime_target" = "ACCEPT" ] || [ "$permanent_target" = "ACCEPT" ]; then
          echo not_configured; exit 0
        fi
      done
      echo configured
  changed_when: false
  register: firewalld_zone_target_status

# Extract audit result
- set_fact:
    firewalld_zone_target_check:
      remediation_status: "{{ true if firewalld_zone_target_status.stdout == 'configured' else false }}"
  changed_when: false

# Choosing the zone target is a site policy decision and is not automated
- name: "firewalld_active_zone_target_configured | Remediation"
  debug:
    msg: "Set the active zone target with firewall-cmd --zone=<ZONE> --set-target=<TARGET> --permanent per site policy, then reload firewalld"
  when: not audit_only and not firewalld_zone_target_check.remediation_status
  changed_when: false

# Expose the remediation hint to the report
- set_fact:
    check_extra: "{{ {'remediation': 'Set the active zone target with firewall-cmd --zone=<ZONE> --set-target=<TARGET> --permanent per site policy'} }}"
  changed_when: false
  when: not firewalld_zone_target_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ firewalld_zone_target_check.remediation_status }}"
