# nosuid_option_set_var_tmp_partition
#
# The nosuid mount option specifies that the filesystem cannot contain setuid files.

- name: "nosuid_option_set_var_tmp_partition | Audit"
  shell:
    cmd: mount | grep -E '\s\/var\/tmp\s' | grep -q nosuid && echo compliant || echo not_compliant
  changed_when: false
  register: var_tmp_nosuid_status

# Extract audit result
- set_fact:
    var_tmp_nosuid:
      remediation_status: "{{ true if var_tmp_nosuid_status.stdout == 'compliant' else false }}"
      remediation: "Consider to mount /var/tmp partition with nosuid option by updating /etc/fstab"
  changed_when: false

# Appending audit result
- name: "nosuid_option_set_var_tmp_partition | Remediation"
  debug:
    msg: "Consider to mount /var/tmp partition with nosuid option by modifing /etc/fstab"
  when: not audit_only and not var_tmp_nosuid.remediation_status
  changed_when: false

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ var_tmp_nosuid.remediation_status }}"
