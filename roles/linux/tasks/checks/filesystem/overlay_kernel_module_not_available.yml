# overlay_kernel_module_not_available
#
# The Linux overlay kernel module, commonly referred to as Overlayfs, is a union mount
# filesystem. It allows the user to overlay one file system on top of another, and creates a
# single, unified view.

- name: "overlay_kernel_module_not_available | Audit"
  shell:
    cmd: modprobe -nqv overlay && echo loaded || echo not_loaded
  changed_when: false
  register: overlay_check_loaded_result
# Check if module is disabled
- name: "overlay_kernel_module_not_available | Audit"
  shell:
    cmd: grep -r -E "^(#)?install overlay /bin/(true|false)" /etc/modprobe.d/ > /dev/null && echo disabled || echo not_disabled
  changed_when: false
  register: overlay_check_disabled_result
# Check if module is blacklisted
- name: "overlay_kernel_module_not_available | Audit"
  shell:
    cmd: grep -r -E "^(#)?blacklist overlay" /etc/modprobe.d/ > /dev/null && echo blacklisted || echo not_blacklisted
  changed_when: false
  register: overlay_check_blacklisted_result
# Check if the module is in use, either by a mounted overlay filesystem or by a
# non zero module reference count
- name: "overlay_kernel_module_not_available | Audit"
  shell:
    cmd: |
      findmnt -knt overlay | grep -q . && { echo in_use; exit 0; }
      reference_count="$(lsmod | awk '$1 == "overlay" { print $3 }')"
      [ -n "$reference_count" ] && [ "$reference_count" != "0" ] && { echo in_use; exit 0; }
      echo not_in_use
  changed_when: false
  register: overlay_check_in_use_result

# Extract audit result
- set_fact:
    overlay_check:
      remediation_status: "{{ true if (overlay_check_loaded_result.stdout == 'not_loaded' or (overlay_check_disabled_result.stdout == 'disabled' and overlay_check_blacklisted_result.stdout == 'blacklisted')) else false }}"
  changed_when: false

# Remediation | Enforce the required configuration line
- name: "overlay_kernel_module_not_available | Remediation"
  lineinfile:
    path: "/etc/modprobe.d/overlay.conf"
    regexp: "^(#)?install overlay(\\s|$)"
    line: "install overlay /bin/false"
    create: true
    mode: "0600"
  when: not audit_only and overlay_check_disabled_result.stdout == 'not_disabled' and overlay_check_in_use_result.stdout != 'in_use'

# Remediation | Enforce the required configuration line
- name: "overlay_kernel_module_not_available | Remediation"
  lineinfile:
    path: /etc/modprobe.d/blacklist.conf
    regexp: "^(#)?blacklist overlay(\\s|$)"
    line: "blacklist overlay"
    create: true
    mode: "0600"
  when: not audit_only and overlay_check_blacklisted_result.stdout == 'not_blacklisted' and overlay_check_in_use_result.stdout != 'in_use'

# Unload the overlay module. Deny listing and unloading are skipped while the
# module is in use, because they break the workloads that mount overlay
# filesystems and the unload fails on a module with active references.
- name: "overlay_kernel_module_not_available | Remediation"
  modprobe:
    name: overlay
    state: absent
  when: not audit_only and not overlay_check.remediation_status and overlay_check_in_use_result.stdout != 'in_use'

# Expose the reason the remediation is skipped to the report
- set_fact:
    check_extra: "{{ {'remediation': 'The overlay module is in use by a mounted overlay filesystem, deny listing and unloading it require a site policy exception'} }}"
  changed_when: false
  when: overlay_check_in_use_result.stdout == 'in_use' and not overlay_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ overlay_check.remediation_status }}"
