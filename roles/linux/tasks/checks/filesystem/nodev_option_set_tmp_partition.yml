# nodev_option_set_tmp_partition
#
# The nodev mount option specifies that the filesystem cannot contain special devices.

- name: "nodev_option_set_tmp_partition | Audit"
  shell:
    cmd: mount | grep -E '\s\/tmp\s' | grep -q nodev && echo compliant || echo not_compliant
  changed_when: false
  register: tmp_nodev_status

# Extract audit result
- set_fact:
    tmp_nodev:
      remediation_status: "{{ true if tmp_nodev_status.stdout == 'compliant' else false }}"
      remediation: "Consider to mount /tmp partition with nodev option by updating /etc/fstab"
  changed_when: false

# Appending audit result
- name: "nodev_option_set_tmp_partition | Remediation"
  debug:
    msg: "Consider to mount /tmp partition with nodev option by modifing /etc/fstab"
  when: not audit_only and not tmp_nodev.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ tmp_nodev.remediation_status }}"
