# noexec_option_set_dev_shm_partition
#
# The noexec mount option specifies that the filesystem cannot contain executable binaries.

- name: "noexec_option_set_dev_shm_partition | Audit"
  shell:
    cmd: mount | grep -E '\s\/dev/shm\s' | grep -q noexec && echo compliant || echo not_compliant
  changed_when: false
  register: shm_noexec_status

# Extract audit result
- set_fact:
    shm_noexec:
      remediation_status: "{{ true if shm_noexec_status.stdout == 'compliant' else false }}"
      remediation: "Consider to mount /dev/shm partition with noexec option by updating /etc/fstab"
  changed_when: false

# Appending audit result
- name: "noexec_option_set_dev_shm_partition | Remediation"
  debug:
    msg: "Consider to mount /dev/shm partition with noexec option by modifing /etc/fstab"
  when: not audit_only and not shm_noexec.remediation_status
  changed_when: false

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ shm_noexec.remediation_status }}"
