# nodev_option_set_var_tmp_partition
#
# The nodev mount option specifies that the filesystem cannot contain special devices.

- name: "nodev_option_set_var_tmp_partition | Audit"
  shell:
    cmd: mount | grep -E '\s\/var\/tmp\s' | grep -q nodev && echo compliant || echo not_compliant
  changed_when: false
  register: var_tmp_nodev_status

# Extract audit result
- set_fact:
    var_tmp_nodev:
      remediation_status: "{{ true if var_tmp_nodev_status.stdout == 'compliant' else false }}"
      remediation: "Consider to mount /var/tmp partition with nodev option by updating /etc/fstab"
  changed_when: false

# Appending audit result
- name: "nodev_option_set_var_tmp_partition | Remediation"
  debug:
    msg: "Consider to mount /var/tmp partition with nodev option by modifing /etc/fstab"
  when: not audit_only and not var_tmp_nodev.remediation_status
  changed_when: false

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ var_tmp_nodev.remediation_status }}"
