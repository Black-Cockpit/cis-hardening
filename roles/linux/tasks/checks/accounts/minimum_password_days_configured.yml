# minimum_password_days_configured
#
# PASS_MIN_DAYS restricts how frequently a user can change their password,
# preventing users from cycling passwords to defeat the password history
# requirement. The value must be greater than 0 for new and existing users.

- name: "minimum_password_days_configured | Audit"
  shell:
    cmd: |
      grep -Piq -- '^\h*PASS_MIN_DAYS\h+[1-9]' /etc/login.defs || { echo not_configured; exit 0; }
      violating_users="$(awk -F: '($2~/^\$.+\$/) {if($4 < 1)print $1}' /etc/shadow | wc -l)"
      [ "$violating_users" -eq 0 ] && echo configured || echo not_configured
  changed_when: false
  register: pass_min_days_status

# Extract audit result
- set_fact:
    pass_min_days_check:
      remediation_status: "{{ true if pass_min_days_status.stdout == 'configured' else false }}"
  changed_when: false

# Remediation | Enforce the required configuration line
- name: "minimum_password_days_configured | Remediation"
  lineinfile:
    path: /etc/login.defs
    regexp: '^\s*#?\s*PASS_MIN_DAYS\s+'
    line: "PASS_MIN_DAYS 1"
  when: not audit_only and not pass_min_days_check.remediation_status

# Remediation | Apply the remediation commands
- name: "minimum_password_days_configured | Remediation"
  shell:
    cmd: |
      awk -F: '($2~/^\$.+\$/) {if($4 < 1)print $1}' /etc/shadow | while read -r user_name; do
        chage --mindays 1 "$user_name"
      done
      exit 0
  when: not audit_only and not pass_min_days_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ pass_min_days_check.remediation_status }}"
