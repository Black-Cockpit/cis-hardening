# system_accounts_do_not_have_valid_login_shell
#
# System (service) accounts, except root, halt, sync, shutdown and
# nfsnobody, must not have a valid login shell so they cannot be used for
# interactive logins.

- name: "system_accounts_do_not_have_valid_login_shell | Audit"
  shell:
    cmd: |
      valid_shells="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\\\/,g;p}' | paste -s -d '|' - ))$"
      uid_min="$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)"
      awk -v pat="$valid_shells" -v min="$uid_min" -F: '($1!~/^(root|halt|sync|shutdown|nfsnobody)$/ && ($3 < min || $3 == 65534) && $(NF) ~ pat) {print $1}' /etc/passwd
      exit 0
  changed_when: false
  register: system_accounts_shell_status

# Extract audit result
- set_fact:
    system_accounts_shell_check:
      remediation_status: "{{ true if system_accounts_shell_status.stdout == '' else false }}"
  changed_when: false

# Remediation | Apply the remediation commands
- name: "system_accounts_do_not_have_valid_login_shell | Remediation"
  shell:
    cmd: |
      valid_shells="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\\\/,g;p}' | paste -s -d '|' - ))$"
      uid_min="$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)"
      awk -v pat="$valid_shells" -v min="$uid_min" -F: '($1!~/^(root|halt|sync|shutdown|nfsnobody)$/ && ($3 < min || $3 == 65534) && $(NF) ~ pat) {print $1}' /etc/passwd | while read -r service_account; do
        usermod -s "$(command -v nologin)" "$service_account"
      done
      exit 0
  when: not audit_only and not system_accounts_shell_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ system_accounts_shell_check.remediation_status }}"
