# strong_password_hashing_algorithm_configured
#
# A cryptographic hash function converts an arbitrary-length input into a fixed length
# output. Password hashing performs a one-way transformation of a password, turning
# the password into another string, called the hashed password.
#
# ENCRYPT_METHOD in /etc/login.defs is required by every benchmark version. The
# older Rocky/CentOS 8 v2 benchmark also requires crypt_style in
# /etc/libuser.conf; distributions where libuser is not installed do not ship
# that file, so it is handled only when present.

# Audit the login.defs hashing method (required across every benchmark version)
- name: "strong_password_hashing_algorithm_configured | Audit"
  shell:
    cmd: |
      grep -Piq -- '^\h*ENCRYPT_METHOD\h+(SHA512|yescrypt)\b' /etc/login.defs && echo 'configured' || echo 'not_configured'
  changed_when: false
  register: password_encrypt_method_status_check

# Determine whether libuser is present; /etc/libuser.conf is prescribed by the
# Rocky/CentOS 8 v2 benchmark but absent when libuser is not installed
- name: "strong_password_hashing_algorithm_configured | Audit"
  stat:
    path: /etc/libuser.conf
  changed_when: false
  register: libuser_conf_stat

# Audit the libuser crypt_style only when the file exists
- name: "strong_password_hashing_algorithm_configured | Audit"
  shell:
    cmd: |
      grep -Piq -- '^\h*crypt_style\h*=\h*(sha512|yescrypt)\b' /etc/libuser.conf && echo 'configured' || echo 'not_configured'
  changed_when: false
  register: password_crypt_style_status_check
  when: libuser_conf_stat.stat.exists

# Compliant when login.defs is set and libuser (when present) is also set
- set_fact:
    password_hashing_check:
      remediation_status: "{{ (password_encrypt_method_status_check.stdout == 'configured') and ((not libuser_conf_stat.stat.exists) or (password_crypt_style_status_check.stdout | default('not_configured') == 'configured')) }}"
  changed_when: false

# Set the login.defs hashing method (single idempotent write; matches an
# existing or commented directive, or appends it when missing)
- name: "strong_password_hashing_algorithm_configured | Remediation"
  lineinfile:
    path: /etc/login.defs
    regexp: '^\s*#?\s*ENCRYPT_METHOD\s+.*'
    line: 'ENCRYPT_METHOD SHA512'
  when: not audit_only and not password_hashing_check.remediation_status

# Set the libuser crypt_style only when the file exists (Rocky/CentOS 8 v2)
- name: "strong_password_hashing_algorithm_configured | Remediation"
  lineinfile:
    path: /etc/libuser.conf
    regexp: '^\s*#?\s*crypt_style\s*=.*'
    line: 'crypt_style = sha512'
  when: not audit_only and not password_hashing_check.remediation_status and libuser_conf_stat.stat.exists

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ password_hashing_check.remediation_status }}"
