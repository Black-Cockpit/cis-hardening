# audit_sudoers_modification_collected
#
# Record events that modify the sudoers configuration files.

# Audit | Verify the audit rule for path /etc/sudoers exists on disk
- name: "audit_sudoers_modification_collected | Audit"
  shell:
    cmd: "grep -rhE -- 'path=/etc/sudoers([[:space:]]|$)' /etc/audit/rules.d/*.rules 2>/dev/null | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_sudoers_ondisk

# Audit | Verify the audit rule for path /etc/sudoers is loaded in the kernel
- name: "audit_sudoers_modification_collected | Audit"
  shell:
    cmd: "/sbin/auditctl -l 2>/dev/null | grep -E -- 'path=/etc/sudoers([[:space:]]|$)' | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_sudoers_loaded

# Remediation | Add the audit rule for path /etc/sudoers when missing
- name: "audit_sudoers_modification_collected | Remediation"
  lineinfile:
    path: "/etc/audit/rules.d/50-cis-v10.rules"
    line: "-a always,exit -F arch=b64 -S all -F path=/etc/sudoers -F perm=wa -k scope"
    create: true
    mode: "0640"
    owner: root
    group: root
  when: not audit_only and not etc_sudoers_ondisk.stdout | int > 0

# Audit | Verify the audit rule for dir /etc/sudoers.d exists on disk
- name: "audit_sudoers_modification_collected | Audit"
  shell:
    cmd: "grep -rhE -- 'dir=/etc/sudoers[.]d([[:space:]]|$)' /etc/audit/rules.d/*.rules 2>/dev/null | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_sudoers_d_ondisk

# Audit | Verify the audit rule for dir /etc/sudoers.d is loaded in the kernel
- name: "audit_sudoers_modification_collected | Audit"
  shell:
    cmd: "/sbin/auditctl -l 2>/dev/null | grep -E -- 'dir=/etc/sudoers[.]d([[:space:]]|$)' | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_sudoers_d_loaded

# Remediation | Add the audit rule for dir /etc/sudoers.d when missing
- name: "audit_sudoers_modification_collected | Remediation"
  lineinfile:
    path: "/etc/audit/rules.d/50-cis-v10.rules"
    line: "-a always,exit -F arch=b64 -S all -F dir=/etc/sudoers.d -F perm=wa -k scope"
    create: true
    mode: "0640"
    owner: root
    group: root
  when: not audit_only and not etc_sudoers_d_ondisk.stdout | int > 0

# Audit | Derive the overall compliance of this rule
- set_fact:
    audit_sudoers_modification_collected_check:
      remediation_status: "{{ true if ((etc_sudoers_ondisk.stdout | int > 0 and etc_sudoers_loaded.stdout | int > 0) and (etc_sudoers_d_ondisk.stdout | int > 0 and etc_sudoers_d_loaded.stdout | int > 0)) else false }}"
  changed_when: false

# Remediation | Load the audit rules into the kernel
- name: "audit_sudoers_modification_collected | Remediation"
  shell:
    cmd: |
      /sbin/auditctl -D > /dev/null 2>&1
      /sbin/augenrules --load
  when: not audit_only and not audit_sudoers_modification_collected_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ audit_sudoers_modification_collected_check.remediation_status }}"

