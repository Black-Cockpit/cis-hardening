# audit_hosts_hostname_modification_collected
#
# Record events that modify the static host name resolution files.

# Audit | Verify the audit rule for path /etc/hosts exists on disk
- name: "audit_hosts_hostname_modification_collected | Audit"
  shell:
    cmd: "grep -rhE -- 'path=/etc/hosts([[:space:]]|$)' /etc/audit/rules.d/*.rules 2>/dev/null | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_hosts_ondisk

# Audit | Verify the audit rule for path /etc/hosts is loaded in the kernel
- name: "audit_hosts_hostname_modification_collected | Audit"
  shell:
    cmd: "/sbin/auditctl -l 2>/dev/null | grep -E -- 'path=/etc/hosts([[:space:]]|$)' | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_hosts_loaded

# Remediation | Add the audit rule for path /etc/hosts when missing
- name: "audit_hosts_hostname_modification_collected | Remediation"
  lineinfile:
    path: "/etc/audit/rules.d/50-cis-v10.rules"
    line: "-a always,exit -F arch=b64 -S all -F path=/etc/hosts -F perm=wa -k system-locale"
    create: true
    mode: "0640"
    owner: root
    group: root
  when: not audit_only and not etc_hosts_ondisk.stdout | int > 0

# Audit | Verify the audit rule for path /etc/hostname exists on disk
- name: "audit_hosts_hostname_modification_collected | Audit"
  shell:
    cmd: "grep -rhE -- 'path=/etc/hostname([[:space:]]|$)' /etc/audit/rules.d/*.rules 2>/dev/null | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_hostname_ondisk

# Audit | Verify the audit rule for path /etc/hostname is loaded in the kernel
- name: "audit_hosts_hostname_modification_collected | Audit"
  shell:
    cmd: "/sbin/auditctl -l 2>/dev/null | grep -E -- 'path=/etc/hostname([[:space:]]|$)' | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_hostname_loaded

# Remediation | Add the audit rule for path /etc/hostname when missing
- name: "audit_hosts_hostname_modification_collected | Remediation"
  lineinfile:
    path: "/etc/audit/rules.d/50-cis-v10.rules"
    line: "-a always,exit -F arch=b64 -S all -F path=/etc/hostname -F perm=wa -k system-locale"
    create: true
    mode: "0640"
    owner: root
    group: root
  when: not audit_only and not etc_hostname_ondisk.stdout | int > 0

# Audit | Derive the overall compliance of this rule
- set_fact:
    audit_hosts_hostname_modification_collected_check:
      remediation_status: "{{ true if ((etc_hosts_ondisk.stdout | int > 0 and etc_hosts_loaded.stdout | int > 0) and (etc_hostname_ondisk.stdout | int > 0 and etc_hostname_loaded.stdout | int > 0)) else false }}"
  changed_when: false

# Remediation | Load the audit rules into the kernel
- name: "audit_hosts_hostname_modification_collected | Remediation"
  shell:
    cmd: |
      /sbin/auditctl -D > /dev/null 2>&1
      /sbin/augenrules --load
  when: not audit_only and not audit_hosts_hostname_modification_collected_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ audit_hosts_hostname_modification_collected_check.remediation_status }}"

