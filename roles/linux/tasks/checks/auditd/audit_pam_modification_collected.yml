# audit_pam_modification_collected
#
# Record events that modify the PAM configuration.

# Audit | Verify the audit rule for path /etc/pam.conf exists on disk
- name: "audit_pam_modification_collected | Audit"
  shell:
    cmd: "grep -rhE -- 'path=/etc/pam[.]conf([[:space:]]|$)' /etc/audit/rules.d/*.rules 2>/dev/null | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_pam_conf_ondisk

# Audit | Verify the audit rule for path /etc/pam.conf is loaded in the kernel
- name: "audit_pam_modification_collected | Audit"
  shell:
    cmd: "/sbin/auditctl -l 2>/dev/null | grep -E -- 'path=/etc/pam[.]conf([[:space:]]|$)' | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_pam_conf_loaded

# Remediation | Add the audit rule for path /etc/pam.conf when missing
- name: "audit_pam_modification_collected | Remediation"
  lineinfile:
    path: "/etc/audit/rules.d/50-cis-v10.rules"
    line: "-a always,exit -F arch=b64 -S all -F path=/etc/pam.conf -F perm=wa -k identity"
    create: true
    mode: "0640"
    owner: root
    group: root
  when: not audit_only and not etc_pam_conf_ondisk.stdout | int > 0

# Audit | Verify the audit rule for dir /etc/pam.d exists on disk
- name: "audit_pam_modification_collected | Audit"
  shell:
    cmd: "grep -rhE -- 'dir=/etc/pam[.]d([[:space:]]|$)' /etc/audit/rules.d/*.rules 2>/dev/null | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_pam_d_ondisk

# Audit | Verify the audit rule for dir /etc/pam.d is loaded in the kernel
- name: "audit_pam_modification_collected | Audit"
  shell:
    cmd: "/sbin/auditctl -l 2>/dev/null | grep -E -- 'dir=/etc/pam[.]d([[:space:]]|$)' | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_pam_d_loaded

# Remediation | Add the audit rule for dir /etc/pam.d when missing
- name: "audit_pam_modification_collected | Remediation"
  lineinfile:
    path: "/etc/audit/rules.d/50-cis-v10.rules"
    line: "-a always,exit -F arch=b64 -S all -F dir=/etc/pam.d -F perm=wa -k identity"
    create: true
    mode: "0640"
    owner: root
    group: root
  when: not audit_only and not etc_pam_d_ondisk.stdout | int > 0

# Audit | Derive the overall compliance of this rule
- set_fact:
    audit_pam_modification_collected_check:
      remediation_status: "{{ true if ((etc_pam_conf_ondisk.stdout | int > 0 and etc_pam_conf_loaded.stdout | int > 0) and (etc_pam_d_ondisk.stdout | int > 0 and etc_pam_d_loaded.stdout | int > 0)) else false }}"
  changed_when: false

# Remediation | Load the audit rules into the kernel
- name: "audit_pam_modification_collected | Remediation"
  shell:
    cmd: |
      /sbin/auditctl -D > /dev/null 2>&1
      /sbin/augenrules --load
  when: not audit_only and not audit_pam_modification_collected_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ audit_pam_modification_collected_check.remediation_status }}"

