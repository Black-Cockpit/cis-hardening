# audit_sethostname_setdomainname_collected
#
# Record events that set the system host name or domain name.

# Audit | Verify the audit rule for syscalls sethostname,setdomainname exists on disk
- name: "audit_sethostname_setdomainname_collected | Audit"
  shell:
    cmd: "grep -rhE -- '-S (sethostname,setdomainname)' /etc/audit/rules.d/*.rules 2>/dev/null | grep 'always,exit' | wc -l"
  changed_when: false
  register: sethostname_setdomainname_ondisk

# Audit | Verify the audit rule for syscalls sethostname,setdomainname is loaded in the kernel
- name: "audit_sethostname_setdomainname_collected | Audit"
  shell:
    cmd: "/sbin/auditctl -l 2>/dev/null | grep -E -- '-S (sethostname,setdomainname)' | grep 'always,exit' | wc -l"
  changed_when: false
  register: sethostname_setdomainname_loaded

# Remediation | Add the audit rule for syscalls sethostname,setdomainname when missing
- name: "audit_sethostname_setdomainname_collected | Remediation"
  lineinfile:
    path: "/etc/audit/rules.d/50-cis-v10.rules"
    line: "-a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale"
    create: true
    mode: "0640"
    owner: root
    group: root
  when: not audit_only and not sethostname_setdomainname_ondisk.stdout | int > 0

# Audit | Derive the overall compliance of this rule
- set_fact:
    audit_sethostname_setdomainname_collected_check:
      remediation_status: "{{ true if ((sethostname_setdomainname_ondisk.stdout | int > 0 and sethostname_setdomainname_loaded.stdout | int > 0)) else false }}"
  changed_when: false

# Remediation | Load the audit rules into the kernel
- name: "audit_sethostname_setdomainname_collected | Remediation"
  shell:
    cmd: |
      /sbin/auditctl -D > /dev/null 2>&1
      /sbin/augenrules --load
  when: not audit_only and not audit_sethostname_setdomainname_collected_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ audit_sethostname_setdomainname_collected_check.remediation_status }}"

