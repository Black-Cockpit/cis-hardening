# audit_shadow_gshadow_modification_collected
#
# Record events that modify the shadowed password files.

# Audit | Verify the audit rule for path /etc/shadow exists on disk
- name: "audit_shadow_gshadow_modification_collected | Audit"
  shell:
    cmd: "grep -rhE -- 'path=/etc/shadow([[:space:]]|$)' /etc/audit/rules.d/*.rules 2>/dev/null | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_shadow_ondisk

# Audit | Verify the audit rule for path /etc/shadow is loaded in the kernel
- name: "audit_shadow_gshadow_modification_collected | Audit"
  shell:
    cmd: "/sbin/auditctl -l 2>/dev/null | grep -E -- 'path=/etc/shadow([[:space:]]|$)' | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_shadow_loaded

# Remediation | Add the audit rule for path /etc/shadow when missing
- name: "audit_shadow_gshadow_modification_collected | Remediation"
  lineinfile:
    path: "/etc/audit/rules.d/50-cis-v10.rules"
    line: "-a always,exit -F arch=b64 -S all -F path=/etc/shadow -F perm=wa -k identity"
    create: true
    mode: "0640"
    owner: root
    group: root
  when: not audit_only and not etc_shadow_ondisk.stdout | int > 0

# Audit | Verify the audit rule for path /etc/gshadow exists on disk
- name: "audit_shadow_gshadow_modification_collected | Audit"
  shell:
    cmd: "grep -rhE -- 'path=/etc/gshadow([[:space:]]|$)' /etc/audit/rules.d/*.rules 2>/dev/null | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_gshadow_ondisk

# Audit | Verify the audit rule for path /etc/gshadow is loaded in the kernel
- name: "audit_shadow_gshadow_modification_collected | Audit"
  shell:
    cmd: "/sbin/auditctl -l 2>/dev/null | grep -E -- 'path=/etc/gshadow([[:space:]]|$)' | grep 'perm=wa' | wc -l"
  changed_when: false
  register: etc_gshadow_loaded

# Remediation | Add the audit rule for path /etc/gshadow when missing
- name: "audit_shadow_gshadow_modification_collected | Remediation"
  lineinfile:
    path: "/etc/audit/rules.d/50-cis-v10.rules"
    line: "-a always,exit -F arch=b64 -S all -F path=/etc/gshadow -F perm=wa -k identity"
    create: true
    mode: "0640"
    owner: root
    group: root
  when: not audit_only and not etc_gshadow_ondisk.stdout | int > 0

# Audit | Derive the overall compliance of this rule
- set_fact:
    audit_shadow_gshadow_modification_collected_check:
      remediation_status: "{{ true if ((etc_shadow_ondisk.stdout | int > 0 and etc_shadow_loaded.stdout | int > 0) and (etc_gshadow_ondisk.stdout | int > 0 and etc_gshadow_loaded.stdout | int > 0)) else false }}"
  changed_when: false

# Remediation | Load the audit rules into the kernel
- name: "audit_shadow_gshadow_modification_collected | Remediation"
  shell:
    cmd: |
      /sbin/auditctl -D > /dev/null 2>&1
      /sbin/augenrules --load
  when: not audit_only and not audit_shadow_gshadow_modification_collected_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ audit_shadow_gshadow_modification_collected_check.remediation_status }}"

