# latest_version_pam_installed
#
# To ensure the system has full functionality and access to the options covered by this
# Benchmark, pam-1.3.1-25 or latter is required

- name: "latest_version_pam_installed | Audit"
  set_fact:
    pam_version: "{{ ansible_facts.packages['pam'][0].version | regex_search('[0-9.]*') }}"
  changed_when: false

# Extract audit result
- set_fact:
    pam_version_check:
      remediation_status: "{{ true if pam_version is version('1.3.1', '>=') else false }}"
  changed_when: false

# Appending audit result
- name: "latest_version_pam_installed | Remediation"
  # latest_version_pam_installed | Remediation
  yum:
    name: pam
    bugfix: true
    security: true
    state: latest
  when: not audit_only and not pam_version_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ pam_version_check.remediation_status }}"
