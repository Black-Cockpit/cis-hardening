# sshd_gssapiauthentication_disabled
#
# The GSSAPIAuthentication parameter allows authentication through GSSAPI.
# Unless GSSAPI authentication is required, it should be disabled to reduce
# the sshd attack surface.

- name: "sshd_gssapiauthentication_disabled | Audit"
  shell:
    cmd: |
      if [ -d /etc/ssh ]; then
          audit_out=$(sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname) /etc/hosts | awk '{print $1}')" | grep -i gssapiauthentication | awk '{print $2}')
          [[ "$audit_out" == "no" ]] && echo 'configured' || echo 'not_configured'
      else
          echo 'configured'
      fi
  changed_when: false
  register: ssh_gssapi_auth_status_check

# Audit | Collect the current configuration state
- name: "sshd_gssapiauthentication_disabled | Audit"
  shell:
    cmd: |
      if [ -d /etc/ssh ]; then
          grep -Pis '^\h*GSSAPIAuthentication\h+"?yes"?\b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf && echo 'not_configured' || echo 'configured'
      else
          echo 'configured'
      fi
  changed_when: false
  register: ssh_gssapi_auth_conf_check

# Extract audit result
- set_fact:
    ssh_gssapi_auth_config_check:
      remediation_status: "{{ true if (ssh_gssapi_auth_status_check.stdout == 'configured' and ssh_gssapi_auth_conf_check.stdout == 'configured') else false }}"
  changed_when: false

# Remediation | Enforce the required configuration line
- name: "sshd_gssapiauthentication_disabled | Remediation"
  lineinfile:
    path: "/etc/ssh/sshd_config"
    regexp: "^(GSSAPIAuthentication|#GSSAPIAuthentication)"
    state: absent
  when: not audit_only and not ssh_gssapi_auth_config_check.remediation_status

# Remediation | Enforce the required configuration line
- name: "sshd_gssapiauthentication_disabled | Remediation"
  lineinfile:
    path: "/etc/ssh/sshd_config"
    line: "GSSAPIAuthentication no"
    state: present
  when: not audit_only and not ssh_gssapi_auth_config_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ ssh_gssapi_auth_config_check.remediation_status }}"
