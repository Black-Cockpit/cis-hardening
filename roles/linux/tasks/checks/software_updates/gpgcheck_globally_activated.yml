# gpgcheck_globally_activated
#
# The gpgcheck option, found in the main section of the /etc/dnf/dnf.conf and individual
# /etc/yum.repos.d/* files, determines if an RPM package's signature is checked prior to
# its installation.

- name: "gpgcheck_globally_activated | Audit"
  shell:
    cmd: grep -q ^gpgcheck /etc/dnf/dnf.conf && echo compliant || echo not_compliant
  changed_when: false
  register: yum_repos_check_status

# Extract audit result
- set_fact:
    yum_repos_check:
      remediation_status: "{{ true if yum_repos_check_status.stdout == 'compliant' else false }}"
  changed_when: false

# Appending audit result
- name: "gpgcheck_globally_activated | Remediation"
  find:
    paths: /etc/yum.repos.d
    patterns: "*.repo"
  ignore_errors: true
  register: yum_repos_list

# gpgcheck_globally_activated | Remediation
- name: "gpgcheck_globally_activated | Remediation"
  replace:
    name: "{{ item.path }}"
    regexp: "^gpgcheck=0"
    replace: "gpgcheck=1"
  with_items:
  - "{{ yum_repos_list.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: not audit_only and not yum_repos_check.remediation_status

# gpgcheck_globally_activated | Remediation
- name: "gpgcheck_globally_activated | Remediation"
  lineinfile:
    path: "{{ item.path }}"
    regexp: "^gpgcheck=0"
    line: "gpgcheck=1"
    state: present
  with_items:
  - "{{ yum_repos_list.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: not audit_only and not yum_repos_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ yum_repos_check.remediation_status }}"
