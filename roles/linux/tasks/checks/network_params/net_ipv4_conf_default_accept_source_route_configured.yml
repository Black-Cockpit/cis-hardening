# net_ipv4_conf_default_accept_source_route_configured
#
# The accept_source_route option causes network interfaces to accept packets with
# the Strict Source Route (SSR) or Loose Source Routing (LSR) option set.
# net.ipv4.conf.default.accept_source_route controls accepting of all IPv4
# packets with the SSR or LSR option set on newly added network interfaces.

- name: "net_ipv4_conf_default_accept_source_route_configured | Audit"
  shell:
    cmd: |
      running="$(sysctl -n net.ipv4.conf.default.accept_source_route 2>/dev/null)"
      persisted="$(grep -hEs "^\s*net[.]ipv4[.]conf[.]default[.]accept_source_route\s*=" {{ sysctl_conf_files | join(' ') }} 2>/dev/null | tail -1 | awk -F= '{print $2}' | tr -d "[:space:]")"
      [ "$running" = "0" ] && [ "$persisted" = "0" ] && echo configured || echo not_configured
  changed_when: false
  register: net_ipv4_conf_default_accept_source_route_status

# Extract audit result
- set_fact:
    net_ipv4_conf_default_accept_source_route_check:
      remediation_status: "{{ true if net_ipv4_conf_default_accept_source_route_status.stdout == 'configured' else false }}"
  changed_when: false

# Remediation | Enforce the required kernel parameter
- name: "net_ipv4_conf_default_accept_source_route_configured | Remediation"
  ansible.posix.sysctl:
    name: net.ipv4.conf.default.accept_source_route
    value: 0
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not net_ipv4_conf_default_accept_source_route_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ net_ipv4_conf_default_accept_source_route_check.remediation_status }}"
