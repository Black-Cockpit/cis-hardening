# net_ipv4_icmp_echo_ignore_broadcasts_configured
#
# net.ipv4.icmp_echo_ignore_broadcasts controls if all ICMP echo and timestamp
# requests to broadcast and multicast addresses are ignored.

- name: "net_ipv4_icmp_echo_ignore_broadcasts_configured | Audit"
  shell:
    cmd: |
      running="$(sysctl -n net.ipv4.icmp_echo_ignore_broadcasts 2>/dev/null)"
      persisted="$(grep -hEs "^\s*net[.]ipv4[.]icmp_echo_ignore_broadcasts\s*=" {{ sysctl_conf_files | join(' ') }} 2>/dev/null | tail -1 | awk -F= '{print $2}' | tr -d "[:space:]")"
      [ "$running" = "1" ] && [ "$persisted" = "1" ] && echo configured || echo not_configured
  changed_when: false
  register: net_ipv4_icmp_echo_ignore_broadcasts_status

# Extract audit result
- set_fact:
    net_ipv4_icmp_echo_ignore_broadcasts_check:
      remediation_status: "{{ true if net_ipv4_icmp_echo_ignore_broadcasts_status.stdout == 'configured' else false }}"
  changed_when: false

# Remediation | Enforce the required kernel parameter
- name: "net_ipv4_icmp_echo_ignore_broadcasts_configured | Remediation"
  ansible.posix.sysctl:
    name: net.ipv4.icmp_echo_ignore_broadcasts
    value: 1
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not net_ipv4_icmp_echo_ignore_broadcasts_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ net_ipv4_icmp_echo_ignore_broadcasts_check.remediation_status }}"
