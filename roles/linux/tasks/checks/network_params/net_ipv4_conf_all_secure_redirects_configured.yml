# net_ipv4_conf_all_secure_redirects_configured
#
# Secure ICMP redirects are the same as ICMP redirects, except they come from
# gateways listed on the default gateway list. It is assumed that these gateways are
# known to your system, and that they are likely to be secure.

- name: "net_ipv4_conf_all_secure_redirects_configured | Audit"
  shell:
    cmd: |
      running="$(sysctl -n net.ipv4.conf.all.secure_redirects 2>/dev/null)"
      persisted="$(grep -hEs "^\s*net[.]ipv4[.]conf[.]all[.]secure_redirects\s*=" {{ sysctl_conf_files | join(' ') }} 2>/dev/null | tail -1 | awk -F= '{print $2}' | tr -d "[:space:]")"
      [ "$running" = "0" ] && [ "$persisted" = "0" ] && echo configured || echo not_configured
  changed_when: false
  register: net_ipv4_conf_all_secure_redirects_status

# Extract audit result
- set_fact:
    net_ipv4_conf_all_secure_redirects_check:
      remediation_status: "{{ true if net_ipv4_conf_all_secure_redirects_status.stdout == 'configured' else false }}"
  changed_when: false

# Remediation | Enforce the required kernel parameter
- name: "net_ipv4_conf_all_secure_redirects_configured | Remediation"
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.secure_redirects
    value: 0
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not net_ipv4_conf_all_secure_redirects_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ net_ipv4_conf_all_secure_redirects_check.remediation_status }}"
