# net_ipv4_ip_forward_configured
#
# The net.ipv4.ip_forward flag tells the system whether it can forward IPv4 packets or
# not.
# Note:

- name: "net_ipv4_ip_forward_configured | Audit"
  shell:
    cmd: |
      running="$(sysctl -n net.ipv4.ip_forward 2>/dev/null)"
      persisted="$(grep -hEs "^\s*net[.]ipv4[.]ip_forward\s*=" {{ sysctl_conf_files | join(' ') }} 2>/dev/null | tail -1 | awk -F= '{print $2}' | tr -d "[:space:]")"
      [ "$running" = "0" ] && [ "$persisted" = "0" ] && echo configured || echo not_configured
  changed_when: false
  register: net_ipv4_ip_forward_status

# Extract audit result
- set_fact:
    net_ipv4_ip_forward_check:
      remediation_status: "{{ true if net_ipv4_ip_forward_status.stdout == 'configured' else false }}"
  changed_when: false

# Remediation | Enforce the required kernel parameter
- name: "net_ipv4_ip_forward_configured | Remediation"
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: 0
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not net_ipv4_ip_forward_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ net_ipv4_ip_forward_check.remediation_status }}"
