  block:
  # Check current net.ipv4.conf.default.send_redirects status
  - name: "packet_redirect_sending_disabled | Audit"
    shell:
      cmd: |
        ipv4="$(sysctl "net.ipv4.conf.default.send_redirects" | awk -F= '{print $2}')";
