# net_ipv4_icmp_ignore_bogus_error_responses_configured
#
# net.ipv4.icmp_ignore_bogus_error_responses controls if the kernel logs bogus
# responses (RFC-1122 non-compliant) from broadcast reframes.

- name: "net_ipv4_icmp_ignore_bogus_error_responses_configured | Audit"
  shell:
    cmd: |
      running="$(sysctl -n net.ipv4.icmp_ignore_bogus_error_responses 2>/dev/null)"
      persisted="$(grep -hEs "^\s*net[.]ipv4[.]icmp_ignore_bogus_error_responses\s*=" {{ sysctl_conf_files | join(' ') }} 2>/dev/null | tail -1 | awk -F= '{print $2}' | tr -d "[:space:]")"
      [ "$running" = "1" ] && [ "$persisted" = "1" ] && echo configured || echo not_configured
  changed_when: false
  register: net_ipv4_icmp_ignore_bogus_error_responses_status

# Extract audit result
- set_fact:
    net_ipv4_icmp_ignore_bogus_error_responses_check:
      remediation_status: "{{ true if net_ipv4_icmp_ignore_bogus_error_responses_status.stdout == 'configured' else false }}"
  changed_when: false

# Remediation | Enforce the required kernel parameter
- name: "net_ipv4_icmp_ignore_bogus_error_responses_configured | Remediation"
  ansible.posix.sysctl:
    name: net.ipv4.icmp_ignore_bogus_error_responses
    value: 1
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not net_ipv4_icmp_ignore_bogus_error_responses_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ net_ipv4_icmp_ignore_bogus_error_responses_check.remediation_status }}"
