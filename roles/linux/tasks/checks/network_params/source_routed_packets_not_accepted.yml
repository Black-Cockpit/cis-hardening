    name: net.ipv6.conf.all.accept_source_route
    value: 0
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not is_ipv6_disabled and not source_routed_packet_check.remediation_status

# source_routed_packets_not_accepted | Remediation
- name: "source_routed_packets_not_accepted | Remediation"
  ansible.posix.sysctl:
    name: net.ipv6.conf.default.accept_source_route
    value: 0
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not source_routed_packet_check.remediation_status

# source_routed_packets_not_accepted | Remediation
- name: "source_routed_packets_not_accepted | Remediation"
  ansible.posix.sysctl:
    name: net.ipv4.route.flush
    value: 1
    sysctl_set: false
    reload: true
  when: not audit_only and not is_ipv6_disabled and not source_routed_packet_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ source_routed_packet_check.remediation_status }}"
