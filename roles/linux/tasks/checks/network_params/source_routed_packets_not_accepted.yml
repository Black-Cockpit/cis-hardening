# Extract audit result
- set_fact:
    source_routed_packet_check:
      remediation_status: "{{ true if source_routed_packet_remediation_status else false }}"
  changed_when: false

# Appending audit result
- name: "source_routed_packets_not_accepted | Remediation"
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.accept_source_route
    value: 0
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not source_routed_packet_check.remediation_status

# source_routed_packets_not_accepted | Remediation
- name: "source_routed_packets_not_accepted | Remediation"
  ansible.posix.sysctl:
    name: net.ipv4.conf.default.accept_source_route
    value: 0
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not source_routed_packet_check.remediation_status

# source_routed_packets_not_accepted | Remediation
- name: "source_routed_packets_not_accepted | Remediation"
