    name: net.ipv6.conf.all.accept_redirects
    value: 0
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not is_ipv6_disabled and not icmp_redirects_accept_check.remediation_status

# icmp_redirects_not_accepted | Remediation
- name: "icmp_redirects_not_accepted | Remediation"
  ansible.posix.sysctl:
    name: net.ipv6.conf.default.accept_redirects
    value: 0
    state: present
    sysctl_set: true
    reload: true
  when: not audit_only and not is_ipv6_disabled and not icmp_redirects_accept_check.remediation_status

# icmp_redirects_not_accepted | Remediation
- name: "icmp_redirects_not_accepted | Remediation"
  ansible.posix.sysctl:
    name: net.ipv4.route.flush
    value: 1
    sysctl_set: false
    reload: true
  when: not audit_only and not icmp_redirects_accept_check.remediation_status

# Record the verdict for this check
- set_fact:
    check_compliant: "{{ icmp_redirects_accept_check.remediation_status }}"
