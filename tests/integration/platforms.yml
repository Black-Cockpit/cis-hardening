# Integration test matrix for the cis_hardening.linux role.
#
# Each entry is one disposable VM. The Vagrantfile defines one machine per
# entry and run.sh drives it through audit -> harden -> reboot -> verify.
# Adding an OS, version, benchmark version or level profile is a new entry
# here plus a matching expected_failures/<name>.yml — no harness code.
#
# Fields:
#   box                VirtualBox Vagrant box (ships a 20 GB root disk,
#                      which is enough for the hardening upgrades)
#   memory / cpus      VM resources
#   benchmark_mapping  which vars/benchmarks/<name>.yml the role loads
#   levels             CIS levels requested for this run
#   become_password    password set on the vagrant user (default 'vagrant')
#                      so become survives the sudoers NOPASSWD strip
platforms:
  rocky8_l1:
    box: rockylinux/8
    memory: 2048
    cpus: 2
    disk_size: 20GB
    benchmark_mapping: rocky8_v2
    become_password: vagrant
    levels:
      - server_level_1

  rocky8_l2:
    box: rockylinux/8
    memory: 2048
    cpus: 2
    disk_size: 20GB
    benchmark_mapping: rocky8_v2
    become_password: vagrant
    levels:
      - server_level_1
      - server_level_2

  alma10_l1:
    box: almalinux/10
    memory: 2048
    cpus: 2
    disk_size: 20GB
    benchmark_mapping: almalinux10_v1
    become_password: vagrant
    levels:
      - server_level_1

  alma10_l2:
    box: almalinux/10
    memory: 2048
    cpus: 2
    disk_size: 20GB
    benchmark_mapping: almalinux10_v1
    become_password: vagrant
    levels:
      - server_level_1
      - server_level_2

  rocky10_l1:
    box: cloud-image/rocky-10
    memory: 2048
    cpus: 2
    disk_size: 20GB
    benchmark_mapping: rocky10_v1
    become_password: vagrant
    levels:
      - server_level_1

  rocky10_l2:
    box: cloud-image/rocky-10
    memory: 2048
    cpus: 2
    disk_size: 20GB
    benchmark_mapping: rocky10_v1
    become_password: vagrant
    levels:
      - server_level_1
      - server_level_2
