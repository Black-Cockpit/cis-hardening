# Ansible configuration for the integration harness.
#
# Paths are relative to this directory (tests/integration), which is where
# run.sh invokes ansible-playbook from. The repository root is two levels
# up, so the role lives at ../../roles.
[defaults]
roles_path = ../../roles
# Pinned, harness-local collections: community.general 7.5.1 still supports
# the target's Python 3.6 (newer versions require 3.7+, which the modprobe
# module needs and Rocky 8 lacks). Listed first so it wins over any newer
# copy in the user's ~/.ansible/collections.
collections_path = ./collections
host_key_checking = False
stdout_callback = default
retry_files_enabled = False

[ssh_connection]
# Pipelining is intentionally disabled: the hardening role adds
# "Defaults use_pty" to sudoers, and once NOPASSWD is stripped become uses
# a sudo password prompt. Pipelining conflicts with that combination, so
# the harness trades a little speed for a reliable become transport.
pipelining = False
